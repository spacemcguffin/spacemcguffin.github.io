<!doctype html>
<html lang="en">
  <head> 
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./app/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.187.0",
          "three/": "https://esm.sh/three@0.187.0/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="veil" id="veil" role="status" aria-live="polite">
        <p class="veil__line" id="veil-line"></p>
        <span class="veil__rule" aria-hidden="true"
          ><span class="veil__fill" id="veil-fill"></span
        ></span>
      </div>
      <p id="startup-status" role="alert"></p>
    </main>

    <template id="debug-template">
      <aside class="debug" aria-label="">
        <dl class="debug__readout">
          <div>
            <dt data-key="fps"></dt>
            <dd data-value="fps"></dd>
          </div>
          <div>
            <dt data-key="lamp"></dt>
            <dd data-value="lamp"></dd>
          </div>
          <div>
            <dt data-key="tier"></dt>
            <dd data-value="tier"></dd>
          </div>
          <div>
            <dt data-key="reference"></dt>
            <dd data-value="reference"></dd>
          </div>
        </dl>
        <p class="debug__keys"></p>
      </aside>
    </template>

    <template id="marker-template">
      <span class="lamp-marker" aria-hidden="true"></span>
    </template>

    <script>
      window.addEventListener(
        "error",
        (event) => {
          const status = document.getElementById("startup-status");
          if (status && !window.__lighthouseStarted) {
            status.textContent =
              "The light failed to start: " +
              (event.message || "a script did not load");
          }
        },
        true
      );
    </script>
    <script type="module" src="./app/main.js"></script>
    <link
      rel="stylesheet"
      href="https://assets.commonletter.com/codepen.css"
      media="print"
      referrerpolicy="no-referrer-when-downgrade"
    />
  </body>
</html>
