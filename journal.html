<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>lewis.lc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #EFEFFA;
      --muted: rgba(239, 239, 250, 0.48);
      --line: rgba(239, 239, 250, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;

      background:
        radial-gradient(
          circle farthest-corner at center,
          #3C4B57 0%,
          #1C262B 100%
        );

      background-attachment: fixed;

      color: var(--text);
      font-family: "Google Sans Flex", sans-serif;
      -webkit-font-smoothing: antialiased;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    ::-moz-selection {
      background: #cfd8e4;
      color: #000000;
      text-shadow: none;
    }

    ::selection {
      background: #cfd8e4;
      color: #000000;
      text-shadow: none;
    }

    /* FEED */

    .feed {
      width: min(360px, calc(100% - 48px));
      padding: 60px 0;
    }

    /* HEADER */

    .feed-header {
      margin-bottom: 26px;
      text-align: center;
    }

    .feed-header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .feed-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    /* UPDATES */

    .update {
      padding: 17px 4px;
      border-bottom: 1px solid var(--line);
    }

    .update:first-child {
      border-top: 1px solid var(--line);
    }

    .date {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
    }

    .update-title {
      margin: 0 0 6px;
      color: rgba(239, 239, 250, 0.58);
      font-size: 11px;
      font-weight: 450;
      font-style: italic;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .update-title::before {
      content: "—";
      margin-right: 5px;
      color: rgba(239, 239, 250, 0.30);
    }

    .message {
      margin: 0;
      color: rgba(239, 239, 250, 0.92);
      font-size: 12px;
      font-weight: 300;
      line-height: 1.5;
    }

    .message a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: rgba(239, 239, 250, 0.28);
      text-underline-offset: 3px;
    }

    .message a:hover {
      text-decoration-color: var(--text);
    }

    /* FOOTER */

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .footer a {
      display: inline-flex;
      align-items: center;
      gap: 4px;

      color: inherit;
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--text);
    }

    .footer-divider {
      color: rgba(239, 239, 250, 0.22);
    }

    .chevron {
      display: block;
      width: 9px;
      height: 9px;
      flex: 0 0 auto;

      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* MOBILE */

    @media (max-width: 500px) {
      body {
        align-items: flex-start;
      }

      .feed {
        width: calc(100% - 40px);
        padding: 70px 0;
      }
    }
  </style>
</head>

<body id="top">

  <main class="feed">

    <header class="feed-header">
      <h1>lewis.lc</h1>
      <p>micro journal</p>
    </header>

    <section class="updates">

		

      <article class="update">
        <time class="date">24 SEP · 00:02AM</time>
        <h2 class="update-title">site update</h2>
        <p class="message">
          made this place a little more private. you need to know the direct links to find anything beyond this page. feels cosy.
        </p>
      </article>


		


    </section>

    <footer class="footer">

      <a href="/">
        <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M7.5 2.5 4 6l3.5 3.5"/>
        </svg>
        <span>back</span>
      </a>

      <span class="footer-divider">·</span>

      <a href="#top">
        <span>back to top</span>
        <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.5 7.5 6 4l3.5 3.5"/>
        </svg>
      </a>

    </footer>

  </main>

</body>
</html>
