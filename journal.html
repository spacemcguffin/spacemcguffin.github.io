<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>lewis.lc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #EFEFFA;
      --muted: rgba(239, 239, 250, 0.48);
      --line: rgba(239, 239, 250, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;

      background:
        radial-gradient(
          circle farthest-corner at center,
          #3C4B57 0%,
          #1C262B 100%
        );

      background-attachment: fixed;

      color: var(--text);
      font-family: "Google Sans Flex", sans-serif;
      -webkit-font-smoothing: antialiased;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    ::-moz-selection {
      background: #cfd8e4;
      color: #000000;
      text-shadow: none;
    }

    ::selection {
      background: #cfd8e4;
      color: #000000;
      text-shadow: none;
    }

    /* FEED */

    .feed {
      width: min(360px, calc(100% - 48px));
      padding: 60px 0;
    }

    /* HEADER */

    .feed-header {
      margin-bottom: 26px;
      text-align: center;
    }

    .feed-header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .feed-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    /* YEAR DIVIDERS */

    .year-divider {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 25px 4px 9px;

      color: rgba(239, 239, 250, 0.32);

      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .year-divider:first-child {
      padding-top: 0;
      color: rgba(239, 239, 250, 0.55);
    }

    .year-divider::before,
    .year-divider::after {
      content: "";

      height: 1px;
      flex: 1;

      background: var(--line);
    }

    /* UPDATES */

    .update {
      padding: 17px 4px;
      border-bottom: 1px solid var(--line);

      scroll-margin-top: 40px;

      transition:
        background-color 0.4s ease,
        padding 0.4s ease,
        margin 0.4s ease;
    }

    /* Remove border from the last update before a new year */

    .update:has(+ .year-divider) {
      border-bottom: none;
    }

    /* Direct-linked entry */

    .update:target {
      margin-left: -8px;
      margin-right: -8px;
      padding-left: 12px;
      padding-right: 12px;

      background: rgba(239, 239, 250, 0.035);
      border-radius: 7px;
    }

    /* DATE / PERMALINK */

    .date {
      display: block;
      width: fit-content;
      margin-bottom: 10px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;

      text-decoration: none;

      transition: color 0.2s ease;
    }

    .date:hover {
      color: var(--text);
    }

    .update:target .date {
      color: rgba(239, 239, 250, 0.72);
    }

    /* MESSAGE */

    .message {
      margin: 0;

      color: rgba(239, 239, 250, 0.92);

      font-size: 12px;
      font-weight: 300;
      line-height: 1.5;
    }

    .message a {
      color: #AFC8D8;

      text-decoration: underline;
      text-decoration-color: rgba(175, 200, 216, 0.32);
      text-underline-offset: 3px;

      transition:
        color 0.2s ease,
        text-decoration-color 0.2s ease;
    }

    .message a:hover {
      color: #D4E3EC;
      text-decoration-color: #D4E3EC;
    }

    /* FOOTER */

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      margin-top: 22px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 400;
    }

    .footer a {
      display: inline-flex;
      align-items: center;
      gap: 4px;

      color: inherit;
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--text);
    }

    .footer-divider {
      color: rgba(239, 239, 250, 0.22);
    }

    .chevron {
      display: block;

      width: 9px;
      height: 9px;

      flex: 0 0 auto;

      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* MOBILE */

    @media (max-width: 500px) {
      body {
        align-items: flex-start;
      }

      .feed {
        width: calc(100% - 40px);
        padding: 70px 0;
      }
    }
  </style>
</head>

<body id="top">

  <main class="feed">

    <header class="feed-header">
      <h1>lewis.lc</h1>
      <p>micro journal</p>
    </header>

    <section class="updates">

      <!-- 2026 -->

      <div class="year-divider">
        <span>2026</span>
      </div>

      <article class="update" id="2">
        <a class="date" href="#2">25 Sep · 10:15PM</a>

        <p class="message">
          blasting music, in my own little world. working on <a href="https://southpark.guide/">South Park Guide</a>.
        </p>
      </article>

      <article class="update" id="1">
        <a class="date" href="#1">24 Sep · 00:02am</a>

        <p class="message">
          made this place a little more private. you need to know the direct links to find anything beyond this page. feels cosy.
        </p>
      </article>

    </section>

    <footer class="footer">

      <a href="/">
        <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M7.5 2.5 4 6l3.5 3.5"/>
        </svg>
        <span>back</span>
      </a>

      <span class="footer-divider">·</span>

      <a href="#top">
        <span>back to top</span>

        <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.5 7.5 6 4l3.5 3.5"/>
        </svg>
      </a>

    </footer>

  </main>

</body>
</html>
