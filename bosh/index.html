<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Who — Series Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Google+Sans+Flex:opsz,wght@6..144,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111b;--surface:#0d1823;--line:#203142;--text:#f6f8fb;--muted:#9eafc4;--blue:#63cfff}
*{box-sizing:border-box}
.icon{width:1.35em;height:1.35em;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon .fill,.icon.fill{fill:currentColor;stroke:none}
.icon-play{width:1.15em;height:1.15em}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
button,a,select{font:inherit}.shell{width:min(1720px,calc(100% - 108px));margin:auto}
button{cursor:pointer}

/* top navigation */
.topbar{position:absolute;z-index:20;inset:0 0 auto;height:82px;display:flex;align-items:center}
.topbar-inner{display:flex;align-items:center;gap:42px}
.wordmark{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.bbc{display:grid;grid-template-columns:repeat(3,14px);gap:2px}.bbc i{height:11px;background:#fff;color:#07111b;font-size:8px;font-style:normal;font-weight:900;display:grid;place-items:center}
.dw{font-family:"Google Sans Flex",sans-serif;font-size:1.15rem;letter-spacing:.18em;font-weight:500}
.nav{display:flex;gap:31px}.nav a{color:#c4cfdb;text-decoration:none;font-size:.84rem;padding:28px 0 23px;position:relative}
.nav a.active,.nav a:hover{color:#fff}.nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:13px;height:2px;background:var(--blue);box-shadow:0 0 13px var(--blue)}
.tools{margin-left:auto;display:flex;align-items:center;gap:13px;color:#d8e0e9}.search-btn{border:0;background:none;color:#fff;width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:1.15rem}.avatar{width:42px;height:42px;border:1px solid var(--blue);border-radius:50%;background:radial-gradient(circle at 55% 35%,#42b9ff55,transparent 28%),#081a2b}

/* hero */
.hero{height:540px;min-height:540px;position:relative;overflow:hidden;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.hero-art{position:absolute;inset:0;background:
radial-gradient(circle at 70% 40%,#72b9ff33,transparent 24%),
radial-gradient(circle at 47% 15%,#5b82ff25,transparent 28%),
linear-gradient(115deg,#07111b 0 25%,#0b2137 47%,#112b47 68%,#07111b 100%)}
.hero-art:before{content:"";position:absolute;inset:0;background-image:
radial-gradient(circle at 8% 18%,#fff 0 1px,transparent 1.4px),
radial-gradient(circle at 22% 38%,#8dd9ff 0 1px,transparent 1.5px),
radial-gradient(circle at 43% 22%,#fff 0 1px,transparent 1.3px),
radial-gradient(circle at 61% 13%,#fff 0 1px,transparent 1.4px),
radial-gradient(circle at 78% 28%,#fff 0 1px,transparent 1.4px),
radial-gradient(circle at 91% 18%,#9edaff 0 1px,transparent 1.5px);background-size:190px 150px}
.hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,12,20,.98),rgba(5,12,20,.76) 31%,rgba(5,12,20,.18) 65%),linear-gradient(0deg,#07111b 0%,transparent 38%)}
.planet{position:absolute;width:330px;height:330px;border-radius:50%;right:21%;top:-125px;background:radial-gradient(circle at 35% 35%,#7188a8,#1c2c43 47%,#07111b 72%);opacity:.72;box-shadow:0 0 60px #4f83bc33}
.tardis{position:absolute;right:17%;top:95px;width:185px;height:330px;background:linear-gradient(90deg,#07192b,#12365c 45%,#061525);border:5px solid #061322;transform:perspective(600px) rotateY(-7deg);box-shadow:0 20px 50px #0009}
.tardis:before{content:"POLICE  PUBLIC CALL  BOX";position:absolute;left:5px;right:5px;top:27px;height:28px;border:2px solid #0a0f16;background:#05080c;color:#f3e8c7;font-size:9px;letter-spacing:.08em;display:grid;place-items:center}
.tardis:after{content:"";position:absolute;left:17px;right:17px;top:72px;bottom:22px;background:repeating-linear-gradient(90deg,transparent 0 47%,#07101b 48% 52%,transparent 53% 100%),repeating-linear-gradient(0deg,#183d67 0 21%,#07101b 22% 25%)}
.hero-content{position:relative;z-index:3;width:620px;padding-top:45px}
.eyebrow{display:flex;align-items:center;gap:11px;color:#d4dfeb;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase}.eyebrow:before{content:"";width:4px;height:17px;background:var(--blue)}
.hero h1{margin:25px 0 17px;font-family:"Google Sans Flex",sans-serif;font-size:clamp(4rem,5.8vw,6.4rem);line-height:.83;letter-spacing:-.055em;font-weight:800;text-transform:uppercase}.hero h1 span{display:block;color:#cde1f7}
.hero-copy{max-width:570px;color:#e2e8ef;font-size:.98rem;line-height:1.5}.hero-actions{display:flex;gap:12px;margin-top:25px}
.btn{height:52px;border:0;border-radius:4px;padding:0 24px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:10px}.btn.primary{background:#fff;color:#0b1117}.btn.secondary{background:#293442;color:#fff}
.tagline{position:absolute;right:3%;top:215px;z-index:3;text-align:center;color:#fff;font-size:.66rem;line-height:3.1;letter-spacing:.48em;text-transform:uppercase;transform:rotate(-1deg)}

/* episode list */
.episodes{padding:30px 0 70px}.episodes-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.episodes h2{font-family:"Google Sans Flex";font-size:1.85rem;margin:0;letter-spacing:-.035em}
.select-wrap{position:relative}.select-wrap .select-chevron{position:absolute;right:15px;top:14px;color:var(--blue);pointer-events:none;width:18px;height:18px}
select{appearance:none;width:185px;height:46px;border:1px solid #293a4c;border-radius:4px;background:#101b27;color:var(--blue);padding:0 42px 0 16px;font-size:.7rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.episode{display:grid;grid-template-columns:50px 285px minmax(0,1fr) 55px;gap:25px;align-items:center;padding:12px 0;border-bottom:1px solid #1d2d3d;min-height:122px}
.num{font-size:2.25rem;font-weight:700;color:#8499b8;text-align:center}.thumb{height:106px;border-radius:4px;background:center/cover;position:relative;overflow:hidden;cursor:pointer}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#06111d55,transparent)}
.info h3{margin:0 0 8px;font-family:"Google Sans Flex";font-size:1.23rem;letter-spacing:-.025em}.meta{color:#9fb7d4;font-size:.67rem;letter-spacing:.11em;text-transform:uppercase;margin-bottom:8px}.desc{margin:0;color:#b9c7d7;font-size:.82rem;line-height:1.42;max-width:720px}
.play-round{width:42px;height:42px;border:1px solid #8294aa;border-radius:50%;background:none;color:#fff;font-size:1rem;display:grid;place-items:center;padding:0}.play-round .icon{width:18px;height:18px}.episode:hover .play-round{border-color:var(--blue);color:var(--blue)}

/* modal */
.modal{position:fixed;z-index:100;inset:0;background:#07111b;opacity:0;visibility:hidden;pointer-events:none;transition:.25s;overflow:auto}.modal.open{opacity:1;visibility:visible;pointer-events:auto}
.modal-art{height:62svh;min-height:430px;background:center/cover;position:relative}.modal-art:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07111b,transparent 65%)}
.modal-body{position:relative;width:min(920px,calc(100% - 80px));margin:-80px auto 0;padding-bottom:90px}.modal-label{color:var(--blue);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase}.modal h3{font-family:"Google Sans Flex";font-size:clamp(3rem,6vw,6rem);line-height:.9;letter-spacing:-.055em;margin:12px 0 15px}.modal-text{color:#c3d0dd;line-height:1.6;max-width:720px}
.close{position:fixed;z-index:5;right:25px;top:20px;width:44px;height:44px;border:1px solid #506071;background:#101a25cc;color:#fff;border-radius:50%;font-size:1rem;display:grid;place-items:center;padding:0}.close .icon{width:20px;height:20px}.modal-nav{position:fixed;z-index:5;top:50%;width:44px;height:64px;background:#101a25cc;color:#fff;border:1px solid #506071;font-size:1rem;display:grid;place-items:center;padding:0}.modal-nav .icon{width:23px;height:23px}.prev{left:16px}.next{right:16px}.modal-nav:disabled{opacity:.2}

/* mobile */
@media(max-width:800px){
.shell{width:calc(100% - 30px)}.nav{display:none}.topbar{height:66px}.dw{font-size:.9rem}.hero{height:720px;min-height:720px;align-items:flex-end}.hero-content{width:100%;padding:0 0 65px}.hero h1{font-size:clamp(3.7rem,18vw,5.8rem)}.hero-art:after{background:linear-gradient(0deg,#07111b 5%,rgba(7,17,27,.25) 64%),linear-gradient(90deg,#07111bbb,transparent)}.planet{right:-80px}.tardis{right:7%;top:90px;width:135px;height:245px;opacity:.78}.tagline{display:none}.episodes-head{align-items:flex-start}.episode{grid-template-columns:32px 1fr 42px;gap:12px}.num{font-size:1.7rem}.thumb{grid-column:2/4;height:auto;aspect-ratio:16/9}.info{grid-column:2}.play-round{grid-column:3}.modal-body{width:calc(100% - 30px)}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topbar-inner">
<a class="wordmark" href="#"><span class="bbc"><i>B</i><i>B</i><i>C</i></span><span class="dw">DOCTOR W✦O</span></a>
<nav class="nav"><a href="#">Home</a><a class="active" href="#episodes">Series</a><a href="#">Specials</a><a href="#">Movies</a><a href="#">Collections</a><a href="#">About</a></nav>
<div class="tools"><button class="search-btn" aria-label="Search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.2 4.2"/></svg></button><span>Search</span><div class="avatar"></div></div>
</div></header>

<section class="hero">
<div class="hero-art"><div class="planet"></div><div class="tardis"></div></div>
<div class="shell"><div class="hero-content">
<div class="eyebrow">Series 2 · 2006 · 13 Episodes</div>
<h1>Doctor Who <span>Series Two</span></h1>
<p class="hero-copy">The Doctor and Rose return for a second series of adventure, danger and discovery, travelling to new worlds and facing old fears.</p>
<div class="hero-actions"><button class="btn primary" onclick="openEpisode(0)"><svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10-6.5z"/></svg> Play</button><button class="btn secondary" onclick="document.querySelector('#episodes').scrollIntoView()">Episodes</button></div>
</div></div>
<div class="tagline">Somewhere<br>in time.<br>Anywhere<br>in space.</div>
</section>

<main class="episodes shell" id="episodes">
<div class="episodes-head"><h2>Episodes</h2><div class="select-wrap"><select><option>Series 2</option></select><svg class="icon select-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg></div></div>
<div id="episodeList"></div>
</main>

<div class="modal" id="modal">
<button class="close" id="close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="modal-nav prev" id="prev" aria-label="Previous episode"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><button class="modal-nav next" id="next" aria-label="Next episode"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
<div class="modal-art" id="modalArt"></div><div class="modal-body"><div class="modal-label" id="modalLabel"></div><h3 id="modalTitle"></h3><p class="modal-text" id="modalText"></p><button class="btn primary"><svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10-6.5z"/></svg> Play episode</button></div>
</div>

<script>
const episodes=[
["The Christmas Invasion","60 MIN · 2005 · 4,283 PLAYS","A new face arrives as the Doctor returns, and an ancient threat awakens beneath the Christmas snow."],
["New Earth","45 MIN · 2006 · 3,912 PLAYS","The Doctor and Rose arrive at a luxury space hospital where something is very wrong beneath the surface."],
["Tooth and Claw","45 MIN · 2006 · 3,441 PLAYS","A remote Scottish estate hides a terrifying secret as the Doctor discovers a werewolf prowling the grounds."],
["School Reunion","45 MIN · 2006 · 3,219 PLAYS","Rose is reunited with an old friend, but a visit to a mysterious school brings back more than just memories."],
["The Girl in the Fireplace","45 MIN · 2006 · 3,087 PLAYS","Clockwork figures stalk an eighteenth-century woman from a spaceship beyond the stars."],
["Rise of the Cybermen","45 MIN · 2006 · 2,944 PLAYS","The TARDIS crashes into a parallel world where a familiar enemy is being created anew."]
];
const art=[
"linear-gradient(150deg,#152f50,#070f1b 65%),radial-gradient(circle at 70% 30%,#fff8,transparent 25%)",
"linear-gradient(150deg,#91a5bb,#203954 45%,#07111b)",
"linear-gradient(150deg,#0d2340,#07111b 65%),radial-gradient(circle at 25% 20%,#dbeaff,transparent 18%)",
"linear-gradient(150deg,#111f35,#07111b 60%),radial-gradient(circle at 70% 30%,#547baf,transparent 30%)",
"linear-gradient(150deg,#513d59,#101729 55%,#07111b)",
"linear-gradient(150deg,#29394c,#07111b 65%)"
];
const list=document.querySelector("#episodeList");
episodes.forEach((e,i)=>list.insertAdjacentHTML("beforeend",`<article class="episode"><div class="num">${i+1}</div><div class="thumb" data-open="${i}" style="background:${art[i]}"></div><div class="info"><h3>${e[0]}</h3><div class="meta">${e[1]}</div><p class="desc">${e[2]}</p></div><button class="play-round" data-open="${i}" aria-label="Play ${e[0]}"><svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10-6.5z"/></svg></button></article>`));
let active=0,modal=document.querySelector("#modal");
function openEpisode(i){active=i;let e=episodes[i];document.querySelector("#modalArt").style.background=art[i];document.querySelector("#modalLabel").textContent=`Series 2 · Episode ${i+1}`;document.querySelector("#modalTitle").textContent=e[0];document.querySelector("#modalText").textContent=e[2];document.querySelector("#prev").disabled=i===0;document.querySelector("#next").disabled=i===episodes.length-1;modal.classList.add("open");document.body.style.overflow="hidden"}
function closeModal(){modal.classList.remove("open");document.body.style.overflow=""}
document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openEpisode(+x.dataset.open));
document.querySelector("#close").onclick=closeModal;document.querySelector("#prev").onclick=()=>active>0&&openEpisode(active-1);document.querySelector("#next").onclick=()=>active<episodes.length-1&&openEpisode(active+1);
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(modal.classList.contains("open")&&e.key==="ArrowLeft"&&active>0)openEpisode(active-1);if(modal.classList.contains("open")&&e.key==="ArrowRight"&&active<episodes.length-1)openEpisode(active+1)});
</script>
</body>
</html>
