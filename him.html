<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartagram — Fire Etch</title>

<style>
:root {
  --background: #050403;
  --ember: #ff5a16;
  --hot: #fff4b0;
  --metal: #171514;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  color: white;
  background:
    radial-gradient(circle at 50% 47%, rgba(133, 31, 5, 0.18), transparent 34%),
    radial-gradient(circle at 50% 50%, #110906 0%, var(--background) 68%);
  font-family: system-ui, sans-serif;
}

.stage {
  position: relative;
  width: min(82vw, 680px);
  aspect-ratio: 500 / 488;
  display: grid;
  place-items: center;
  isolation: isolate;
}

.stage::before {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  background: rgba(255, 62, 8, 0.13);
  filter: blur(54px);
  opacity: 0;
  animation: room-glow 7s ease-out forwards;
}

svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.symbol {
  fill: var(--metal);
  fill-rule: evenodd;
  opacity: 0;
  filter:
    drop-shadow(0 2px 0 rgba(255,255,255,0.05))
    drop-shadow(0 14px 24px rgba(0,0,0,0.8));
  animation:
    reveal-metal 1.15s ease-out 3.9s forwards,
    breathe 7s ease-in-out 5.2s infinite;
}

.scorch {
  fill: none;
  stroke: #4b1204;
  stroke-width: 24;
  stroke-linejoin: round;
  stroke-linecap: round;
  pathLength: 1;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0.72;
  filter: blur(8px);
  animation: etch 4.6s cubic-bezier(.62,.02,.24,1) forwards;
}

.fire-wide {
  fill: none;
  stroke: var(--ember);
  stroke-width: 15;
  stroke-linejoin: round;
  stroke-linecap: round;
  pathLength: 1;
  stroke-dasharray: .14 .86;
  stroke-dashoffset: 1;
  filter:
    blur(5px)
    drop-shadow(0 0 11px #ff2f00)
    drop-shadow(0 0 25px rgba(255,90,18,0.9));
  animation:
    fire-run 4.6s cubic-bezier(.62,.02,.24,1) forwards,
    flame-flicker .09s steps(2) infinite;
}

.fire-core {
  fill: none;
  stroke: var(--hot);
  stroke-width: 4.5;
  stroke-linejoin: round;
  stroke-linecap: round;
  pathLength: 1;
  stroke-dasharray: .055 .945;
  stroke-dashoffset: 1;
  filter:
    drop-shadow(0 0 4px white)
    drop-shadow(0 0 11px #ff9a1f);
  animation:
    fire-run 4.6s cubic-bezier(.62,.02,.24,1) forwards,
    core-flicker .07s steps(2) infinite;
}

.cooling-edge {
  fill: none;
  stroke: rgba(255, 79, 18, 0.9);
  stroke-width: 7;
  stroke-linejoin: round;
  stroke-linecap: round;
  pathLength: 1;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0;
  filter: blur(2px) drop-shadow(0 0 12px #ff3b00);
  animation:
    etch 4.6s cubic-bezier(.62,.02,.24,1) forwards,
    cool-down 2.2s ease-out 4.1s forwards;
}

.embers {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}

.ember {
  position: absolute;
  width: var(--size);
  height: var(--size);
  left: var(--x);
  top: var(--y);
  border-radius: 50%;
  background: #ffd28a;
  box-shadow:
    0 0 5px #fff,
    0 0 12px #ff6a00,
    0 0 22px #ff2600;
  opacity: 0;
  animation: ember-rise var(--duration) ease-out var(--delay) forwards;
}

.smoke {
  position: absolute;
  inset: 4%;
  opacity: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  background:
    radial-gradient(ellipse at 30% 55%, rgba(100,100,100,.13), transparent 25%),
    radial-gradient(ellipse at 66% 42%, rgba(120,120,120,.10), transparent 27%),
    radial-gradient(ellipse at 52% 70%, rgba(120,120,120,.08), transparent 23%);
  filter: blur(22px);
  animation: smoke 6.5s ease-out 1.2s forwards;
}

.grain {
  position: fixed;
  inset: -60%;
  pointer-events: none;
  opacity: 0.075;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
  animation: grain .14s steps(2) infinite;
}

.controls {
  position: fixed;
  right: 20px;
  bottom: 20px;
}

button {
  appearance: none;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 999px;
  padding: 10px 15px;
  color: rgba(255,255,255,.75);
  background: rgba(10,8,7,.62);
  backdrop-filter: blur(10px);
  font: inherit;
  font-size: 12px;
  letter-spacing: .09em;
  text-transform: uppercase;
  cursor: pointer;
  transition: .2s ease;
}

button:hover {
  color: white;
  border-color: rgba(255,108,45,.65);
  transform: translateY(-2px);
}

@keyframes fire-run {
  0% {
    stroke-dashoffset: 1;
    opacity: 0;
  }
  4% {
    opacity: 1;
  }
  88% {
    opacity: 1;
  }
  100% {
    stroke-dashoffset: 0;
    opacity: 0;
  }
}

@keyframes etch {
  from { stroke-dashoffset: 1; }
  to { stroke-dashoffset: 0; }
}

@keyframes flame-flicker {
  0% { stroke-width: 13; opacity: .75; }
  50% { stroke-width: 18; opacity: 1; }
  100% { stroke-width: 14; opacity: .85; }
}

@keyframes core-flicker {
  0% { stroke-width: 3.5; opacity: .8; }
  50% { stroke-width: 6; opacity: 1; }
  100% { stroke-width: 4; opacity: .9; }
}

@keyframes reveal-metal {
  0% {
    opacity: 0;
    filter:
      brightness(2.4)
      drop-shadow(0 0 20px rgba(255,60,0,.9));
  }
  28% {
    opacity: 1;
  }
  100% {
    opacity: 1;
    filter:
      brightness(1)
      drop-shadow(0 2px 0 rgba(255,255,255,.05))
      drop-shadow(0 14px 24px rgba(0,0,0,.8));
  }
}

@keyframes cool-down {
  0% { opacity: .95; }
  35% { opacity: .5; }
  100% { opacity: 0; }
}

@keyframes ember-rise {
  0% {
    opacity: 0;
    transform: translate(0, 0) scale(.4);
  }
  12% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(var(--drift), calc(var(--rise) * -1)) scale(0);
  }
}

@keyframes smoke {
  0% {
    opacity: 0;
    transform: scale(.8) translateY(4%);
  }
  25% {
    opacity: .4;
  }
  100% {
    opacity: 0;
    transform: scale(1.18) translateY(-9%);
  }
}

@keyframes room-glow {
  0%, 4% { opacity: 0; transform: scale(.75); }
  45% { opacity: 1; transform: scale(1.04); }
  100% { opacity: .18; transform: scale(1); }
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.006); }
}

@keyframes grain {
  0% { transform: translate(0,0); }
  25% { transform: translate(4%,-3%); }
  50% { transform: translate(-3%,5%); }
  75% { transform: translate(5%,2%); }
  100% { transform: translate(-4%,-5%); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }

  .symbol {
    opacity: 1;
  }
}
</style>
</head>

<div class="controls">
  <button id="replay" type="button">Replay etch</button>
</div>

<script>
const emberField = document.getElementById("embers");
const stage = document.getElementById("stage");
const replayButton = document.getElementById("replay");

function createEmbers() {
  emberField.innerHTML = "";

  for (let i = 0; i < 58; i++) {
    const ember = document.createElement("i");
    ember.className = "ember";

    const angle = Math.random() * Math.PI * 2;
    const radius = 18 + Math.random() * 32;
    const x = 50 + Math.cos(angle) * radius;
    const y = 51 + Math.sin(angle) * radius;

    ember.style.setProperty("--x", `${x}%`);
    ember.style.setProperty("--y", `${y}%`);
    ember.style.setProperty("--size", `${1.5 + Math.random() * 4}px`);
    ember.style.setProperty("--duration", `${1.1 + Math.random() * 1.9}s`);
    ember.style.setProperty("--delay", `${.7 + Math.random() * 4}s`);
    ember.style.setProperty("--drift", `${-32 + Math.random() * 64}px`);
    ember.style.setProperty("--rise", `${28 + Math.random() * 90}px`);

    emberField.appendChild(ember);
  }
}

function replay() {
  const freshStage = stage.cloneNode(true);
  stage.replaceWith(freshStage);

  const newEmberField = freshStage.querySelector("#embers");
  newEmberField.innerHTML = "";

  for (let i = 0; i < 58; i++) {
    const ember = document.createElement("i");
    ember.className = "ember";

    const angle = Math.random() * Math.PI * 2;
    const radius = 18 + Math.random() * 32;
    const x = 50 + Math.cos(angle) * radius;
    const y = 51 + Math.sin(angle) * radius;

    ember.style.setProperty("--x", `${x}%`);
    ember.style.setProperty("--y", `${y}%`);
    ember.style.setProperty("--size", `${1.5 + Math.random() * 4}px`);
    ember.style.setProperty("--duration", `${1.1 + Math.random() * 1.9}s`);
    ember.style.setProperty("--delay", `${.7 + Math.random() * 4}s`);
    ember.style.setProperty("--drift", `${-32 + Math.random() * 64}px`);
    ember.style.setProperty("--rise", `${28 + Math.random() * 90}px`);

    newEmberField.appendChild(ember);
  }
}

createEmbers();
replayButton.addEventListener("click", replay);
</script>

</html>
