
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalenwave Homepage</title>
  
  <!-- link to the 98.css library -->
  <link rel="stylesheet" href="98.css">
  
  <!-- CSS starts here -->
  <style>
    body {
      background-color: #008080; /* Windows95 desktop teal, 8080 */
      margin: 0;
      padding: 20px;
    }
    
    .layout {
      display: flex;
      gap: 40px; /* gap between side bar and main content boxes */
      max-width: 900px; /* makes a max width for the content on wide screens */
      margin: 0 auto;   /* centers the content */
    }
    
    .sidebar {
      width: 200px;
      flex-shrink: 0; /* means that the sidebar doesn't shrink when the screen size changes */
    }
    
    .content {
      display: flex;
      flex-direction: column; /* says blog posts should stack vertically */
      gap: 30px; /* puts space between the blog post windows */
      flex-grow: 1; /* says this section should stretch to take up the whole screen (up until the max width defined on line 22 */
    }
    
    /* Mobile styling: stacks the columns on small screens */
    @media (max-width: 700px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="layout">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="window">
        <div class="title-bar">
          <div class="title-bar-text">Menu</div>
        </div>
        <div class="window-body">
          <!-- 98.css uses "tree-view" to make lists look like old file explorers -->
          <ul class="tree-view">
            <li><a href="index.html">Home</a></li>
            <!--<li><a href="#">About Me</a></li>-->
            <!--<li><a href="#">Book Recommendations</a></li>-->
            <li><a href="blog.html">Blog</a></li>
            <!--<li><a href="#">Gallery</a></li>-->
            <!--<li><a href="#">Links</a></li>-->
            <!--<li><a href="#">Guestbook</a></li>-->
          </ul>
        </div>
      </div>
    </div>

    <!-- BLOG POST 1 -->
    <div class="content">
      
      <!-- 11 JULY 2026 POST -->
      <div class="window">
        <div class="title-bar">
          <div class="title-bar-text">10 July 2026.txt</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <p>What is it we grieve when we lose someone?</p>
          <iframe src="/blog/1.txt" style="width: 100%; height: 300px; background-color: white; border: 2px inset #dfdfdf;"></iframe>
          <button>OK</button>
        </div>
      </div>
      
      
      <!-- 10 JULY 2026 POST -->
      <div class="window">
        <div class="title-bar">
          <div class="title-bar-text">10 July 2026.txt</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <p>When was the best era of technology?</p>
          <iframe src="/blog/1.txt" style="width: 100%; height: 300px; background-color: white; border: 2px inset #dfdfdf;"></iframe>
          <button>OK</button>
        </div>
      </div>
      

    </div>

  </div>

</body>
</html>
