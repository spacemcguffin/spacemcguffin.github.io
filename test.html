<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>lewis.lc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #EFEFFA;
      --muted: rgba(239, 239, 250, 0.48);
      --line: rgba(239, 239, 250, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(
        circle farthest-corner at center,
        #3C4B57 0%,
        #1C262B 100%
      );
      background-attachment: fixed;
      color: var(--text);
      font-family: "Google Sans Flex", sans-serif;
      -webkit-font-smoothing: antialiased;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .feed {
      width: min(360px, calc(100% - 48px));
      padding: 60px 0;
    }

    .feed-header {
      margin-bottom: 26px;
      text-align: center;
    }

    .feed-header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 550;
      letter-spacing: -0.01em;
    }

    .feed-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .update {
      padding: 17px 4px;
      border-bottom: 1px solid var(--line);
    }

    .update:first-child {
      border-top: 1px solid var(--line);
    }

    .date {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .message {
      margin: 0;
      color: rgba(239, 239, 250, 0.92);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.005em;
    }

    .message a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: rgba(239, 239, 250, 0.28);
      text-underline-offset: 3px;
    }

    .message a:hover {
      text-decoration-color: #EFEFFA;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 10px;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--text);
    }

    @media (max-width: 500px) {
      body {
        align-items: flex-start;
      }

      .feed {
        width: calc(100% - 40px);
        padding-top: 70px;
      }
    }
  </style>
</head>

<body>

  <main class="feed">

    <header class="feed-header">
      <h1>lewis.lc</h1>
      <p>micro journal</p>
    </header>

    <section class="updates">

      <article class="update">
        <time class="date">24 SEP · 00:02AM</time>
        <p class="message">made this place a little more private. you need to know the direct links to find anything beyond this page. feels cosy.</p>
      </article>

 
    </section>

    <footer class="footer">
      <a href="/">← back</a>
    </footer>

  </main>

</body>
</html>
