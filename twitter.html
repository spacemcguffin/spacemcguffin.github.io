const perPage=50, feed=document.querySelector('#feed'), nav=document.querySelector('#pagination');
const params=new URLSearchParams(location.search), single=params.get('post');
const month=document.querySelector('#month'), order=document.querySelector('#order');
for(const m of [...new Set(posts.map(p=>p.date.slice(0,7)))]){const o=document.createElement('option');o.value=m;o.textContent=new Date(m+'-01T12:00:00').toLocaleDateString('en-GB',{month:'long'});month.append(o)}
month.value=[...month.options].some(o=>o.value===params.get('month'))?params.get('month'):'all';order.value=params.get('order')==='newest'?'newest':'oldest';
function url(page=1,post=null){const q=new URLSearchParams({page,month:month.value,order:order.value});if(post)q.set('post',post);return '?'+q.toString()}
month.onchange=order.onchange=()=>location.href=url();
const filtered=posts.filter(p=>month.value==='all'||p.date.startsWith(month.value));if(order.value==='newest')filtered.reverse();
const total=Math.max(1,Math.ceil(filtered.length/perPage)),page=Math.min(total,Math.max(1,parseInt(params.get('page'),10)||1));
function relative(date){return new Date(date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function render(p){const article=document.createElement('article');article.className='post';article.id='post-'+p.id;const bubble=document.createElement('div');bubble.className='bubble';if(p.markdown && window.marked&&window.DOMPurify){bubble.innerHTML=DOMPurify.sanitize(marked.parse(p.text,{breaks:true}));}else{p.text.split(/\n\n/).forEach(t=>{const para=document.createElement('p');para.textContent=t;bubble.append(para)});}if(p.image){const img=document.createElement('img');img.src=p.image;img.alt=p.alt||'';img.loading='lazy';bubble.append(img)}const a=document.createElement('a');a.className='stamp';a.href=url(page,p.id);a.title=relative(p.date);const time=document.createElement('time');time.dateTime=p.date;time.textContent=relative(p.date);a.append(time);article.append(bubble,a);feed.append(article)}
function link(label,href,current=false){const a=document.createElement('a');a.textContent=label;a.href=href;if(current)a.setAttribute('aria-current','page');nav.append(a)}
if(single){const post=posts.find(p=>p.id===single);if(post)render(post);else feed.textContent='Entry not found.';link('← All entries',url(page))}else{filtered.slice((page-1)*perPage,page*perPage).forEach(render);if(page>1)link('← Previous',url(page-1));for(let i=1;i<=total;i++){if(i===1||i===total||Math.abs(i-page)<=1)link(i,url(i),i===page);else if(i===page-2||i===page+2){const dots=document.createElement('span');dots.textContent='…';nav.append(dots)}}if(page<total)link('Next →',url(page+1));}
</script></body></html>
