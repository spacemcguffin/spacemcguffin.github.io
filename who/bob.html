function setFeatured(e){state.featured=e;$('featuredHero').style.setProperty('--hero',`url("${e.image}")`);$('heroBg').style.backgroundImage=`url("${e.image}")`;$('heroKicker').textContent=`${e.doctor} · ${e.series}`;$('heroTitle').textContent=e.title;$('heroMeta').innerHTML=`<span>${e.year}</span><span>${e.format||'Story'}</span><span>${e.companion||''}</span>`;$('heroDesc').textContent=e.synopsis||`An adventure with the ${e.doctor}.`}
function populate(e){const i=episodes.findIndex(x=>x.id===e.id);state.selectedId=e.id;$('detailPosition').textContent=`${i+1} / ${episodes.length}`;$('detailHero').style.setProperty('--modal-image',`url("${e.image}")`);$('detailStoryMarker').textContent=`${e.series} · Story ${i+1}`;$('detailTitle').textContent=e.title;$('detailContext').textContent=[e.doctor,e.series,e.year].filter(Boolean).join(' · ');$('detailSynopsis').textContent=e.synopsis||'';$('detailWriter').textContent=e.writer||'—';$('detailDate').textContent=e.date||'—';$('detailSetting').textContent=textSetting(e);$('detailMonster').textContent=e.monster||'—';$('previousTitle').textContent=episodes[(i-1+episodes.length)%episodes.length].title;$('nextTitle').textContent=episodes[(i+1)%episodes.length].title}
function setModal(open){$('detailsPanel').classList.toggle('open',open);$('detailsBackdrop').classList.toggle('open',open);$('detailsPanel').setAttribute('aria-hidden',String(!open));document.body.style.overflow=open?'hidden':'';if(open)$('detailsPanel').focus({preventScroll:true})}
function openEpisode(id,open=false){const e=episodes.find(x=>x.id===id);if(!e)return;populate(e);if(open)setModal(true)}
function offset(n){let i=episodes.findIndex(e=>e.id===state.selectedId);if(i<0)i=0;openEpisode(episodes[(i+n+episodes.length)%episodes.length].id)}
buildDoctors();buildSeasons();sync();setFeatured(state.featured);render();
$('heroDetails').onclick=()=>openEpisode(state.featured.id,true);$('randomButton').onclick=()=>{const pool=state.filtered.length?state.filtered:episodes;const e=pool[Math.floor(Math.random()*pool.length)];setFeatured(e);openEpisode(e.id,true)};
$('filterToggle').onclick=()=>$('filterDrawer').classList.toggle('open');
$('doctorList').onclick=e=>{const b=e.target.closest('[data-doctor]');if(!b)return;const v=b.dataset.doctor;if(v==='all')state.doctors=[];else state.doctors=state.doctors.includes(v)?state.doctors.filter(x=>x!==v):[...state.doctors,v];sync();render()};
$('eraList').onclick=e=>{const b=e.target.closest('[data-era]');if(!b)return;state.era=state.era===b.dataset.era?null:b.dataset.era;state.seasons=[];sync();render()};
$('seasonList').onclick=e=>{const b=e.target.closest('[data-season]');if(!b)return;const v=b.dataset.season;state.seasons=state.seasons.includes(v)?state.seasons.filter(x=>x!==v):[...state.seasons,v];render();sync()};
$('searchInput').oninput=e=>{state.search=e.target.value;render()};$('clearAll').onclick=()=>{state.doctors=[];state.seasons=[];state.era=null;state.search='';$('searchInput').value='';sync();render()};
$('detailsPrev').onclick=()=>offset(-1);$('detailsNext').onclick=()=>offset(1);$('previousEpisode').onclick=()=>offset(-1);$('nextEpisode').onclick=()=>offset(1);$('inspectorToggle').onclick=()=>setModal(false);$('detailsBackdrop').onclick=()=>setModal(false);
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth'}));document.querySelectorAll('[data-era-jump]').forEach(b=>b.onclick=()=>{state.era=b.dataset.era;state.seasons=[];sync();render();document.getElementById('browse').scrollIntoView({behavior:'smooth'})});
window.addEventListener('scroll',()=>$('topbar').classList.toggle('scrolled',scrollY>20),{passive:true});document.addEventListener('keydown',e=>{if(!$('detailsPanel').classList.contains('open'))return;if(e.key==='Escape')setModal(false);if(e.key==='ArrowLeft')offset(-1);if(e.key==='ArrowRight')offset(1)});
</script></body></html>
