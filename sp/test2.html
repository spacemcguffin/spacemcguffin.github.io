<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>South Park Episode Archive</title>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap">

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
  --yellow: #f5b041;

  --glass:
    rgba(255,255,255,0.09);

  --glass-strong:
    rgba(255,255,255,0.14);

  --glass-border:
    rgba(255,255,255,0.17);

  --glass-border-hover:
    rgba(255,255,255,0.3);

  --text:
    rgba(255,255,255,0.96);

  --text-soft:
    rgba(255,255,255,0.66);

  --text-faint:
    rgba(255,255,255,0.4);
}


/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;

  font-family: "Google Sans Flex", sans-serif;

  color: var(--text);

  background-color: #20253d;

  background-image:
    radial-gradient(
      circle at 20% 20%,
      rgba(109,135,255,0.14),
      transparent 30%
    ),

    radial-gradient(
      circle at 80% 70%,
      rgba(205,116,255,0.12),
      transparent 28%
    ),

    linear-gradient(
      rgba(8,11,24,0.24),
      rgba(8,11,24,0.58)
    ),

    url("/images/nebula.png");

  background-size: cover;
  background-position: center top;
  background-attachment: fixed;

  overflow-x: hidden;
}

body.modal-open {
  overflow: hidden;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--yellow);
  color: #111;
}


/* =========================================================
   PAGE
========================================================= */

.page {
  width: 100%;

  padding:
    55px
    28px
    80px;
}

.site-shell {
  width: min(1180px, 100%);
  margin: 0 auto;
}


/* =========================================================
   GLASS UTILITY
========================================================= */

.glass {
  border:
    1px solid
    var(--glass-border);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.055)
    );

  box-shadow:
    0 22px 65px rgba(0,0,0,0.2),
    inset 0 1px 0 rgba(255,255,255,0.13);

  backdrop-filter:
    blur(22px)
    saturate(135%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(135%);
}


/* =========================================================
   HERO
========================================================= */

.hero {
  position: relative;

  padding:
    24px
    28px
    26px;

  border-radius: 24px;

  overflow: hidden;
}

.hero::before {
  content: "";

  position: absolute;

  width: 300px;
  height: 190px;

  left: -120px;
  top: -120px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.14),
      transparent 68%
    );

  pointer-events: none;
}

.hero-topline {
  position: relative;
  z-index: 1;

  display: flex;
  align-items: center;
  gap: 10px;

  margin-bottom: 9px;

  color: var(--text-soft);

  font-size: 0.66rem;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: 0.16em;
}

.hero-topline::before {
  content: "";

  width: 20px;
  height: 2px;

  border-radius: 100px;

  background: var(--yellow);
}

.hero h1 {
  position: relative;
  z-index: 1;

  max-width: 680px;

  font-family: "Google Sans Flex", sans-serif;

  font-size:
    clamp(
      2.55rem,
      5.2vw,
      4.75rem
    );

  font-weight: 620;

  line-height: 0.88;

  letter-spacing: -0.065em;
}

.hero h1 span {
  position: relative;
  display: inline-block;
}

.hero h1 span::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: -8px;

  height: 4px;

  border-radius: 50%;

  background: var(--yellow);

  transform: rotate(-1deg);
}

.hero-description {
  position: relative;
  z-index: 1;

  max-width: 650px;

  margin-top: 21px;

  color: var(--text-soft);

  font-size: 0.9rem;
  line-height: 1.65;
}

.hero-stats {
  position: relative;
  z-index: 1;

  display: flex;
  flex-wrap: wrap;

  gap: 9px;

  margin-top: 20px;
}

.stat-pill {
  padding:
    8px
    11px;

  border:
    1px solid
    rgba(255,255,255,0.13);

  border-radius: 999px;

  background:
    rgba(255,255,255,0.06);

  color:
    rgba(255,255,255,0.62);

  font-size: 0.65rem;
  font-weight: 650;

  letter-spacing: 0.07em;

  text-transform: uppercase;

  backdrop-filter: blur(10px);
}


/* =========================================================
   SECTION BASICS
========================================================= */

.section {
  margin-top: 58px;
}

.section-heading {
  display: flex;

  align-items: flex-end;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 19px;
}

.section-kicker {
  margin-bottom: 6px;

  color: var(--yellow);

  font-size: 0.62rem;
  font-weight: 700;

  letter-spacing: 0.16em;

  text-transform: uppercase;
}

.section-title {
  font-family: "Google Sans Flex", sans-serif;

  font-size:
    clamp(
      1.8rem,
      4vw,
      2.65rem
    );

  font-weight: 590;

  line-height: 1;

  letter-spacing: -0.04em;
}

.section-description {
  max-width: 430px;

  color:
    var(--text-faint);

  font-size: 0.76rem;
  line-height: 1.45;

  text-align: right;
}


/* =========================================================
   BROWSE TOOLBAR
========================================================= */

.browse-panel {
  padding:
    18px;

  border-radius: 24px;
}

.toolbar {
  display: grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap: 12px;

  align-items: center;
}

.search-wrap {
  position: relative;
}

.search-icon {
  position: absolute;

  left: 16px;
  top: 50%;

  transform: translateY(-50%);

  pointer-events: none;

  color:
    rgba(255,255,255,0.45);

  font-size: 1rem;
}

.search-input {
  width: 100%;

  height: 50px;

  padding:
    0
    18px
    0
    43px;

  border:
    1px solid
    rgba(255,255,255,0.14);

  border-radius: 15px;

  outline: none;

  background:
    rgba(255,255,255,0.065);

  color: #fff;

  font-size: 0.86rem;

  backdrop-filter:
    blur(12px);

  transition:
    border-color 0.25s ease,
    background 0.25s ease;
}

.search-input::placeholder {
  color:
    rgba(255,255,255,0.35);
}

.search-input:focus {
  border-color:
    rgba(255,255,255,0.34);

  background:
    rgba(255,255,255,0.09);
}

.random-button {
  height: 50px;

  padding:
    0
    19px;

  border:
    1px solid
    rgba(255,255,255,0.15);

  border-radius: 15px;

  background:
    rgba(255,255,255,0.08);

  color:
    rgba(255,255,255,0.85);

  cursor: pointer;

  font-size: 0.68rem;
  font-weight: 700;

  letter-spacing: 0.08em;

  text-transform: uppercase;

  transition:
    background 0.25s ease,
    color 0.25s ease,
    transform 0.25s ease;
}

.random-button:hover {
  transform:
    translateY(-2px);

  background: var(--yellow);

  color: #111;
}


/* =========================================================
   SEASON RAIL
========================================================= */

.season-area {
  margin-top: 16px;
}

.season-label {
  margin-bottom: 9px;

  color:
    var(--text-faint);

  font-size: 0.59rem;
  font-weight: 700;

  letter-spacing: 0.13em;

  text-transform: uppercase;
}

.season-rail {
  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 3px;

  scrollbar-width: none;
}

.season-rail::-webkit-scrollbar {
  display: none;
}

.season-button {
  flex: 0 0 auto;

  min-width: 42px;

  height: 38px;

  padding:
    0
    12px;

  border:
    1px solid
    rgba(255,255,255,0.13);

  border-radius: 999px;

  background:
    rgba(255,255,255,0.055);

  color:
    rgba(255,255,255,0.55);

  cursor: pointer;

  font-size: 0.68rem;
  font-weight: 680;

  transition:
    background 0.25s ease,
    color 0.25s ease,
    border-color 0.25s ease,
    transform 0.25s ease;
}

.season-button:hover {
  transform:
    translateY(-1px);

  color: #fff;

  border-color:
    rgba(255,255,255,0.28);
}

.season-button.active {
  color: #111;

  background: var(--yellow);

  border-color: var(--yellow);
}


/* =========================================================
   ACTIVE FILTERS
========================================================= */

.active-filters {
  display: none;
  position: sticky;
  top: 14px;
  z-index: 80;

  align-items: center;
  flex-wrap: wrap;
  gap: 7px;

  margin-top: 12px;
  padding: 10px 12px;

  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      rgba(30,35,58,0.88),
      rgba(18,22,40,0.78)
    );

  box-shadow:
    0 14px 38px rgba(0,0,0,0.24),
    inset 0 1px 0 rgba(255,255,255,0.12);

  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
}

.active-filters.visible {
  display: flex;
}

.active-filters-label {
  margin-right: 2px;

  color: var(--text-faint);

  font-size: 0.56rem;
  font-weight: 700;

  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.active-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  min-height: 29px;
  padding: 0 9px 0 10px;

  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 999px;

  background: rgba(255,255,255,0.065);
  color: rgba(255,255,255,0.72);

  cursor: pointer;

  font-size: 0.61rem;
  font-weight: 650;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease;
}

.active-filter-chip:hover {
  background: rgba(255,255,255,0.11);
  border-color: rgba(255,255,255,0.24);
  color: #fff;
}

.active-filter-chip .filter-x {
  color: rgba(255,255,255,0.42);
  font-size: 0.82rem;
  line-height: 1;
}

.clear-active-filters {
  margin-left: auto;

  border: 0;
  background: transparent;

  color: rgba(255,255,255,0.42);

  cursor: pointer;

  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;

  transition: color 0.2s ease;
}

.clear-active-filters:hover {
  color: #fff;
}

/* =========================================================
   RESULTS STATUS
========================================================= */

.results-line {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin:
    28px
    2px
    0;

  color:
    var(--text-faint);

  font-size: 0.67rem;

  letter-spacing: 0.06em;

  text-transform: uppercase;
}


/* =========================================================
   ARCHIVE
========================================================= */

.archive {
  margin-top: 35px;
}

.season-section {
  margin-bottom: 62px;

  animation:
    revealSeason
    0.35s
    ease
    both;
}

@keyframes revealSeason {

  from {
    opacity: 0;
    transform:
      translateY(8px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}

.season-header {
  display: flex;

  align-items: flex-end;
  justify-content: space-between;

  gap: 25px;

  padding-bottom: 14px;

  margin-bottom: 18px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.1);
}

.season-name {
  font-family: "Google Sans Flex", sans-serif;

  font-size:
    clamp(
      1.65rem,
      4vw,
      2.25rem
    );

  font-weight: 580;

  letter-spacing: -0.04em;
}

.season-year {
  margin-top: 5px;

  color:
    var(--text-faint);

  font-size: 0.64rem;
  font-weight: 650;

  letter-spacing: 0.09em;

  text-transform: uppercase;
}

.season-count {
  color:
    var(--text-faint);

  font-size: 0.62rem;
  font-weight: 650;

  letter-spacing: 0.08em;

  text-transform: uppercase;
}


/* =========================================================
   EPISODE GRID
========================================================= */

.episode-grid {
  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap: 16px;
}

.episode-card {
  position: relative;

  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,0.14);

  border-radius: 19px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.095),
      rgba(255,255,255,0.045)
    );

  box-shadow:
    0 16px 38px rgba(0,0,0,0.14),
    inset 0 1px 0 rgba(255,255,255,0.09);

  backdrop-filter:
    blur(18px)
    saturate(125%);

  cursor: pointer;

  transition:
    transform 0.35s cubic-bezier(.2,.8,.2,1),
    border-color 0.3s ease,
    background 0.3s ease;
}

.episode-card:hover {
  transform:
    translateY(-5px);

  border-color:
    rgba(255,255,255,0.28);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.13),
      rgba(255,255,255,0.06)
    );
}

.grid-image {
  position: relative;

  margin:
    8px
    8px
    0;

  border-radius: 13px;

  overflow: hidden;
}

.grid-image img {
  display: block;

  width: 100%;

  aspect-ratio: 16 / 10;

  object-fit: cover;

  transition:
    transform 0.55s
    cubic-bezier(.2,.8,.2,1);
}

.episode-card:hover
.grid-image img {
  transform: scale(1.04);
}

.grid-image::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(5,7,15,0.3),
      transparent 56%
    );
}

.grid-number {
  position: absolute;

  z-index: 2;

  left: 9px;
  top: 9px;
  right: auto;
  bottom: auto;

  padding:
    5px
    7px;

  border-radius: 999px;

  border:
    1px solid
    rgba(255,255,255,0.2);

  background:
    rgba(8,10,20,0.55);

  color: #fff;

  font-size: 0.55rem;
  font-weight: 700;

  letter-spacing: 0.07em;

  backdrop-filter:
    blur(10px);
}

.grid-copy {
  padding:
    13px
    15px
    16px;
}

.grid-title {
  margin-bottom: 7px;

  font-family: "Google Sans Flex", sans-serif;

  font-size: 1.2rem;
  font-weight: 570;

  line-height: 1.15;

  letter-spacing: -0.02em;
}

.grid-date {
  color:
    var(--text-faint);

  font-size: 0.58rem;
  font-weight: 650;

  letter-spacing: 0.075em;

  text-transform: uppercase;
}


/* =========================================================
   EMPTY RESULTS
========================================================= */

.empty-state {
  padding:
    60px
    25px;

  border:
    1px solid
    rgba(255,255,255,0.12);

  border-radius: 22px;

  background:
    rgba(255,255,255,0.045);

  text-align: center;

  color:
    var(--text-soft);

  backdrop-filter:
    blur(15px);
}

.empty-state strong {
  display: block;

  margin-bottom: 7px;

  color: #fff;

  font-family: "Google Sans Flex", sans-serif;

  font-size: 1.3rem;

  font-weight: 580;
}


/* =========================================================
   MODAL
========================================================= */

.episode-modal {
  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 28px;

  visibility: hidden;
  opacity: 0;

  background:
    rgba(5,7,16,0.58);

  backdrop-filter:
    blur(22px)
    saturate(125%);

  transition:
    visibility 0.35s ease,
    opacity 0.35s ease;
}

.episode-modal.active {
  visibility: visible;
  opacity: 1;
}

.modal-panel {
  position: relative;

  width:
    min(
      930px,
      100%
    );

  max-height:
    calc(
      100vh
      -
      56px
    );

  overflow-y: auto;

  border:
    1px solid
    rgba(255,255,255,0.2);

  border-radius: 28px;

  color: #fff;

  background:
    linear-gradient(
      145deg,
      rgba(34,39,64,0.9),
      rgba(18,22,40,0.84)
    );

  box-shadow:
    0 45px 130px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.16);

  backdrop-filter:
    blur(26px)
    saturate(130%);

  transform:
    translateY(20px)
    scale(0.98);

  opacity: 0;

  transition:
    transform 0.4s cubic-bezier(.2,.8,.2,1),
    opacity 0.35s ease;
}

.episode-modal.active
.modal-panel {
  transform:
    translateY(0)
    scale(1);

  opacity: 1;
}


/* =========================================================
   MODAL CLOSE
========================================================= */

.modal-close {
  position: absolute;

  z-index: 10;

  right: 17px;
  top: 17px;

  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  border:
    1px solid
    rgba(255,255,255,0.24);

  border-radius: 50%;

  background:
    rgba(12,14,26,0.48);

  color: #fff;

  font-size: 1.2rem;

  cursor: pointer;

  backdrop-filter:
    blur(14px);

  transition:
    transform 0.25s ease,
    background 0.25s ease,
    color 0.25s ease;
}

.modal-close:hover {
  transform: scale(1.07);

  background:
    rgba(255,255,255,0.92);

  color: #111;
}


/* directional episode-change motion is applied with the Web Animations API */
.modal-scroll {
  will-change: transform, opacity;
}

/* =========================================================
   MODAL HERO
========================================================= */

.modal-image {
  position: relative;

  height:
    clamp(
      320px,
      48vw,
      500px
    );

  overflow: hidden;

  border-radius:
    27px
    27px
    0
    0;
}

.modal-image img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transform: scale(1.02);

  transition:
    transform 0.75s
    cubic-bezier(.2,.8,.2,1);
}

.episode-modal.active
.modal-image img {
  transform: scale(1);
}

.modal-image::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(12,15,28,0.98),
      rgba(12,15,28,0.28) 42%,
      transparent 70%
    );
}

.modal-image-copy {
  position: absolute;

  z-index: 2;

  left: 30px;
  right: 80px;

  bottom: 27px;
}

.modal-episode {
  margin-bottom: 8px;

  color:
    rgba(255,255,255,0.65);

  font-size: 0.68rem;
  font-weight: 700;

  letter-spacing: 0.13em;

  text-transform: uppercase;
}

.modal-title {
  font-family: "Google Sans Flex", sans-serif;

  font-size:
    clamp(
      2.2rem,
      6vw,
      4rem
    );

  font-weight: 620;

  line-height: 0.94;

  letter-spacing: -0.055em;
}


/* =========================================================
   MODAL BODY
========================================================= */

.modal-content {
  padding:
    28px
    31px
    31px;
}

.modal-info-row {
  display: flex;
  flex-wrap: wrap;

  gap: 9px;

  margin-bottom: 23px;
}

.modal-info {
  padding:
    9px
    12px;

  border:
    1px solid
    rgba(255,255,255,0.13);

  border-radius: 11px;

  background:
    rgba(255,255,255,0.065);

  color:
    rgba(255,255,255,0.65);

  font-size: 0.64rem;
  font-weight: 650;

  letter-spacing: 0.07em;

  text-transform: uppercase;
}

.modal-description {
  max-width: 760px;

  color:
    rgba(255,255,255,0.73);

  font-size: 1rem;
  line-height: 1.7;
}


/* =========================================================
   MODAL NAV
========================================================= */

.modal-navigation {
  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 12px;

  margin-top: 31px;

  padding-top: 22px;

  border-top:
    1px solid
    rgba(255,255,255,0.09);
}

.modal-nav {
  min-height: 67px;

  display: flex;
  align-items: center;

  gap: 11px;

  padding:
    11px
    13px;

  border:
    1px solid
    rgba(255,255,255,0.12);

  border-radius: 14px;

  background:
    rgba(255,255,255,0.055);

  cursor: pointer;

  text-align: left;

  transition:
    background 0.25s ease,
    transform 0.25s ease,
    border-color 0.25s ease;
}

.modal-nav:hover {
  transform:
    translateY(-2px);

  background:
    rgba(255,255,255,0.09);

  border-color:
    rgba(255,255,255,0.22);
}

.modal-nav:disabled,
.modal-top-arrow:disabled {
  opacity: 0.28;
  cursor: default;
  pointer-events: none;
  transform: none;
}

.modal-nav:disabled {
  background: rgba(255,255,255,0.025);
  border-color: rgba(255,255,255,0.07);
}

.modal-nav:disabled .nav-title,
.modal-nav:disabled .nav-label,
.modal-nav:disabled .nav-circle {

}

.modal-nav.next {

  width: 35px;
  height: 35px;

  display: grid;
  place-items: center;

  border:

  border-radius: 50%;

  background:
    rgba(255,255,255,0.06);

/* =========================================================
   MODAL TOP BAR + SAFE INNER SCROLL
========================================================= */

.modal-panel {
  height: min(760px, calc(100vh - 56px));
  max-height: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-topbar {
  position: relative;
  z-index: 20;
  flex: 0 0 54px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid rgba(255,255,255,0.09);
  background: rgba(18,22,40,0.58);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.modal-topbar > .modal-top-arrow:first-child {
  justify-self: start;
}

.modal-topbar-actions {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-counter {
  min-width: 80px;
  text-align: center;
  color: rgba(255,255,255,0.52);
  font-size: 0.65rem;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.modal-counter strong {
  color: #fff;
  font-weight: 760;
}

.modal-top-arrow,
.modal-topbar .modal-close {
  position: static;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,0.11);
  border-radius: 50%;
  background: rgba(255,255,255,0.045);
  color: rgba(255,255,255,0.62);
  font-size: 0.95rem;
  cursor: pointer;
  box-shadow: none;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: transform .22s ease, background .22s ease, color .22s ease, border-color .22s ease;
}

.modal-top-arrow:hover {
  transform: translateY(-1px);
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.2);
  color: #fff;
}

.modal-topbar .modal-close:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.9);
  border-color: rgba(255,255,255,0.9);
  color: #111;
}

.modal-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
}

.modal-scroll::-webkit-scrollbar {
  width: 10px;
}

.modal-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.modal-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.22);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: 999px;
}

.modal-scroll::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.36);
  border: 3px solid transparent;
  background-clip: content-box;
}

.modal-image {
  border-radius: 0;
}

.season-tooltip {
  position: fixed;
  z-index: 400;
  left: 0;
  top: 0;
  padding: 9px 13px;
  border: 1px solid rgba(74,116,170,.45);
  border-radius: 11px;
  background: rgba(5,15,29,.96);

  color: #eef5ff;
  font-size: .73rem;

  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%) translateY(-8px);
  transition: opacity .14s ease, transform .14s ease;
}

.season-tooltip.visible {
  opacity: 1;
  transform: translate(-50%, -100%) translateY(-11px);
}

.season-tooltip::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  width: 8px;
  height: 8px;
  transform: translateX(-50%) rotate(45deg);
  border-right: 1px solid rgba(74,116,170,.45);
  border-bottom: 1px solid rgba(74,116,170,.45);
  background: rgba(5,15,29,.96);

.grid-image::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(
      110deg,
      rgba(255,255,255,.025) 25%,
      rgba(255,255,255,.11) 42%,

}

/* =========================================================
   HELPERS
========================================================= */

function itemType(item) {

  return item && item.type === "special"
    ? "special"
    : "episode";

}


function specialGroupKey(item) {

  if (!item || itemType(item) !== "special") return "";

  if (item.specialGroup) {
    return String(item.specialGroup);
  }

  if (
    Array.isArray(item.betweenSeasons)
    && item.betweenSeasons.length >= 2
  ) {
    return `${item.betweenSeasons[0]}-${item.betweenSeasons[1]}`;
  }

  return "specials";

}


function itemOrder(item) {

  if (Number.isFinite(Number(item.order))) {
    return Number(item.order);
  }

  if (itemType(item) === "special") {
    if (
      Array.isArray(item.betweenSeasons)
      && item.betweenSeasons.length >= 2
    ) {
      const lowerSeason = Math.min(
        Number(item.betweenSeasons[0]),
        Number(item.betweenSeasons[1])
      );

      return lowerSeason * 100 + 50 + (Number(item.special) || 0) / 100;
    }

    return (Number(item.year) || 0) * 10 + (Number(item.special) || 0) / 100;
  }

  return (
    Number(item.season || 0) * 100
    + Number(item.episode || 0)
  );

}


function episodeCode(
  episode
) {

  if (itemType(episode) === "special") {
    return `SPECIAL ${String(episode.special || 1).padStart(2, "0")}`;
  }

  return (
    "S"
    +
    String(
      episode.season
    ).padStart(
      2,
      "0"
    )
    +
    " · E"
    +
    String(
      episode.episode
    ).padStart(
      2,
      "0"
    )
  );

}


function uniqueSeasons() {

  return [
    ...new Set(
      episodes
        .filter(item => itemType(item) === "episode")
        .map(
          episode =>
            episode.season
        )
    )
  ].sort(
    (a, b) =>
      b - a
  );

}


function hasSpecials() {

  return episodes.some(
    item => itemType(item) === "special"
  );

}


function specialSectionLabel(item) {

  if (
    Array.isArray(item?.betweenSeasons)
    && item.betweenSeasons.length >= 2
  ) {
    const low = Math.min(
      Number(item.betweenSeasons[0]),
      Number(item.betweenSeasons[1])
    );
    const high = Math.max(
      Number(item.betweenSeasons[0]),
      Number(item.betweenSeasons[1])
    );

    return `Between Seasons ${low} & ${high}`;
  }

  return "Special releases";

}


function episodeSlug(episode) {

  if (itemType(episode) === "special") {
    return `special-${specialGroupKey(episode)}-${episode.special || 1}`;
  }

  return `s${episode.season}e${episode.episode}`;

}


function findEpisodeIndexBySlug(slug) {

  if (!slug) return -1;

  const specialMatch = /^special-(.+)-(\d+)$/i.exec(slug.trim());

  if (specialMatch) {
    const group = specialMatch[1];
    const specialNumber = Number(specialMatch[2]);

    return episodes.findIndex(
      item =>
        itemType(item) === "special"
        && specialGroupKey(item) === group
        && Number(item.special || 1) === specialNumber
    );
  }

  const match = /^s(\d+)e(\d+)$/i.exec(slug.trim());

  if (!match) return -1;

  const season = Number(match[1]);
  const episodeNumber = Number(match[2]);

  return episodes.findIndex(
    episode =>
      itemType(episode) === "episode"
      && episode.season === season
      && episode.episode === episodeNumber
  );

}


function getSeasonEpisodeIndexes(index = activeEpisodeIndex) {

  const current = episodes[index];

  if (!current) return [];

  if (itemType(current) === "special") {
    const group = specialGroupKey(current);

    return episodes
      .map((episode, episodeIndex) => ({ episode, episodeIndex }))
      .filter(
        item =>
          itemType(item.episode) === "special"
          && specialGroupKey(item.episode) === group
      )
      .sort(
        (a, b) =>
          (Number(a.episode.special) || 0)
          -
          (Number(b.episode.special) || 0)
      )
      .map(item => item.episodeIndex);
  }

  return episodes
    .map((episode, episodeIndex) => ({ episode, episodeIndex }))
    .filter(
      item =>
        itemType(item.episode) === "episode"
        && item.episode.season === current.season
    )
    .sort((a, b) => a.episode.episode - b.episode.episode)
    .map(item => item.episodeIndex);

}



function navigationGroupKey(item) {

  if (!item) return "";

  return itemType(item) === "special"
    ? `special:${specialGroupKey(item)}`
    : `season:${item.season}`;

}


function getGroupIndexesForItem(item) {

  const key = navigationGroupKey(item);

  return episodes
    .map((episode, episodeIndex) => ({ episode, episodeIndex }))
    .filter(entry => navigationGroupKey(entry.episode) === key)
    .sort((a, b) => itemOrder(a.episode) - itemOrder(b.episode))
    .map(entry => entry.episodeIndex);

}


function getCrossGroupNavigation(index = activeEpisodeIndex) {

  const current = episodes[index];

  if (!current) {
    return {
      previousIndex: null,
      nextIndex: null
    };
  }

  const currentGroup = navigationGroupKey(current);
  const chronological = episodes
    .map((episode, episodeIndex) => ({ episode, episodeIndex }))
    .sort((a, b) => itemOrder(a.episode) - itemOrder(b.episode));

  const groupItems = chronological.filter(
    entry => navigationGroupKey(entry.episode) === currentGroup
  );

  if (!groupItems.length) {
    return {
      previousIndex: null,
      nextIndex: null
    };
  }

  const firstPosition = chronological.findIndex(
    entry => entry.episodeIndex === groupItems[0].episodeIndex
  );

  const lastEpisodeIndex = groupItems[groupItems.length - 1].episodeIndex;
  const lastPosition = chronological.findIndex(
    entry => entry.episodeIndex === lastEpisodeIndex
  );

  let previousIndex = null;
  let nextIndex = null;

  for (let i = firstPosition - 1; i >= 0; i--) {
    if (navigationGroupKey(chronological[i].episode) !== currentGroup) {
      previousIndex = chronological[i].episodeIndex;
      break;
    }
  }

  for (let i = lastPosition + 1; i < chronological.length; i++) {
    if (navigationGroupKey(chronological[i].episode) !== currentGroup) {
      nextIndex = chronological[i].episodeIndex;
      break;
    }
  }

  return {
    previousIndex,
    nextIndex
  };

}


function groupDisplayName(item) {

  if (!item) return "";

  return itemType(item) === "special"
    ? "Specials"
    : `Season ${item.season}`;

}


function getSeasonNavigation(index = activeEpisodeIndex) {

  const seasonIndexes = getSeasonEpisodeIndexes(index);
  const localIndex = seasonIndexes.indexOf(index);

  if (!seasonIndexes.length || localIndex === -1) {
    return {
      seasonIndexes: [index],
      localIndex: 0,
      previousIndex: null,
      nextIndex: null
    };
  }

  return {
    seasonIndexes,
    localIndex,
    previousIndex: localIndex > 0
      ? seasonIndexes[localIndex - 1]
      : null,
    nextIndex: localIndex < seasonIndexes.length - 1
      ? seasonIndexes[localIndex + 1]
      : null
  };

}


function syncURL() {

  if (suppressURLSync) return;

  const params = new URLSearchParams();

  if (selectedSeasons.size) {
    params.set(
      "seasons",
      [...selectedSeasons]
        .sort((a, b) => {
          if (a === "specials") return -1;
          if (b === "specials") return 1;
          return Number(b) - Number(a);
        })
        .join(",")
    );
  }

  if (searchInput.value.trim()) {
    params.set("q", searchInput.value.trim());
  }

  if (currentPage > 1) {
    params.set("page", String(currentPage));
  }

  if (viewMode !== "grid") {
    params.set("view", viewMode);
  }

  if (modal.classList.contains("active")) {
    params.set("episode", episodeSlug(episodes[activeEpisodeIndex]));
  }

  const query = params.toString();
  const url = `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash}`;

  history.replaceState(null, "", url);

}


function readURLState() {

  const params = new URLSearchParams(window.location.search);

  selectedSeasons.clear();

  const seasonsParam = params.get("seasons");

  if (seasonsParam) {
    seasonsParam
      .split(",")
      .map(value => value.trim().toLowerCase())
      .forEach(value => {
        if (value === "specials" && hasSpecials()) {
          selectedSeasons.add("specials");
          return;
        }

        const season = Number(value);

        if (Number.isFinite(season) && uniqueSeasons().includes(season)) {
          selectedSeasons.add(season);
        }
      });
  }

  const q = params.get("q") || "";
  searchInput.value = q;
  searchQuery = q.trim().toLowerCase();

  const pageParam = Number(params.get("page"));
  currentPage = Number.isFinite(pageParam) && pageParam > 0 ? Math.floor(pageParam) : 1;

  viewMode = params.get("view") === "list" ? "list" : "grid";

  return findEpisodeIndexBySlug(params.get("episode"));

}


function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================================

========================================================= */

function renderSeasonRail() {

  const seasons = uniqueSeasons();
  const allActive = selectedSeasons.size === 0;

  const entries = seasons.map(season => ({
    type: "season",
    value: season,
    label: String(season),
    name: `Season ${season}`,
    order: season * 100,
    hue: (205 + (season * 37)) % 360
  }));

  if (hasSpecials()) {
    const latestSpecialOrder = Math.max(
      ...episodes
        .filter(item => itemType(item) === "special")
        .map(itemOrder)
    );

    entries.push({
      type: "specials",
      value: "specials",
      label: "SPECIALS",
      name: "Specials",
      order: latestSpecialOrder,
      hue: 322
    });
  }

  entries.sort((a, b) => b.order - a.order);

  const railEntries = [
    `<button class="season-button ${allActive ? "active" : ""}" data-season="all" data-tooltip="All Seasons" style="--season-hue:210">ALL</button>`,
    ...entries.map(entry => `
      <button
        class="season-button ${selectedSeasons.has(entry.value) ? "active" : ""}"
        data-season="${entry.value}"
        style="--season-hue:${entry.hue}"
        data-tooltip="${escapeHTML(entry.name)}"
      >${entry.label}</button>
    `)
  ];

  seasonRail.innerHTML = railEntries.join("");

  if (seasonStripStatus) {
    if (selectedSeasons.size === 0) {
      seasonStripStatus.textContent = "All Seasons";
    } else {
      const labels = [...selectedSeasons]
        .map(value => value === "specials" ? "Specials" : `Season ${value}`)
        .join(" + ");
      seasonStripStatus.textContent = labels;
    }
  }

  if (mobileFilterCount) {
    mobileFilterCount.textContent =
      selectedSeasons.size === 0
        ? "All"
        : String(selectedSeasons.size);
  }

  if (window.matchMedia("(max-width: 760px)").matches) {
    requestAnimationFrame(() => {
      const activeButton =
        seasonRail.querySelector(".season-button.active")
        || seasonRail.querySelector(".season-button");

      activeButton?.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "center"
      });
    });
  }

}


/* =========================================================
   ACTIVE FILTER CHIPS
========================================================= */

function renderActiveFilters() {

  const filters =
    [...selectedSeasons]
      .sort((a, b) => {
        if (a === "specials") return -1;
        if (b === "specials") return 1;
        return Number(b) - Number(a);
      });

  const hasSearch =
    Boolean(searchInput.value.trim());

  if (!filters.length && !hasSearch) {
    activeFilters.classList.remove("visible");
    activeFilters.innerHTML = "";
    return;
  }

  activeFilters.classList.add("visible");

  activeFilters.innerHTML =
    `
      <span class="active-filters-label">
        Active
      </span>

      ${filters.map(filter => {
        const label = filter === "specials"
          ? "Specials"
          : `Season ${filter}`;

        return `
          <button
            type="button"
            class="active-filter-chip"
            data-filter-season="${filter}"
            aria-label="Remove ${label} filter"
          >
            ${label}
            <span class="filter-x">×</span>
          </button>
        `;
      }).join("")}

      ${hasSearch ? `
        <button
          type="button"
          class="active-filter-chip"
          data-clear-search="true"
          aria-label="Clear search filter"
        >
          “${escapeHTML(searchInput.value.trim())}”
          <span class="filter-x">×</span>
        </button>
      ` : ""}

      <button
        type="button"
        class="clear-active-filters"
        data-clear-filters="true"
      >
        Clear all
      </button>
    `;

}

/* =========================================================
   FILTERING
========================================================= */

function getFilteredEpisodes() {

  return episodes.filter(
    episode => {

      const isSpecial =
        itemType(episode) === "special";

      const matchesSeason =
        selectedSeasons.size === 0
        ||
        (
          isSpecial
          ? selectedSeasons.has("specials")
          : selectedSeasons.has(episode.season)
        );

      const haystack =
        (
          episode.title
          + " "
          + episode.description
          + " "
          + episode.date
          + " "
          + (isSpecial ? "special specials " : `season ${episode.season} episode ${episode.episode} `)
          + (episode.special || "")
          + " "
          + (episode.year || "")
        )
        .toLowerCase();

      const matchesSearch =
        !searchQuery
        ||
        haystack.includes(searchQuery);

      return matchesSeason && matchesSearch;

    }
  );

}

   ARCHIVE

function renderViewToggle() {

  gridViewButton.classList.toggle("active", viewMode === "grid");
  listViewButton.classList.toggle("active", viewMode === "list");
  archive.classList.toggle("list-view", viewMode === "list");

}


function renderPagination(totalItems) {

  const totalPages = Math.max(1, Math.ceil(totalItems / EPISODES_PER_PAGE));

  if (currentPage > totalPages) currentPage = totalPages;

  if (totalPages <= 1) {
    archivePagination.innerHTML = "";
    archivePagination.hidden = true;
    return;
  }

  archivePagination.hidden = false;

  const pageButtons = [];
  const windowSize = 2;
  const start = Math.max(1, currentPage - windowSize);
  const end = Math.min(totalPages, currentPage + windowSize);

  if (start > 1) {
    pageButtons.push(`<button class="page-number" data-page="1">1</button>`);
    if (start > 2) pageButtons.push(`<span class="page-ellipsis">…</span>`);
  }

  for (let page = start; page <= end; page++) {
    pageButtons.push(`
      <button
        class="page-number ${page === currentPage ? "active" : ""}"
        data-page="${page}"
        ${page === currentPage ? 'aria-current="page"' : ""}
      >${page}</button>
    `);
  }

  if (end < totalPages) {
    if (end < totalPages - 1) pageButtons.push(`<span class="page-ellipsis">…</span>`);
    pageButtons.push(`<button class="page-number" data-page="${totalPages}">${totalPages}</button>`);
  }

  archivePagination.innerHTML = `
    <button class="page-nav" data-page="${Math.max(1, currentPage - 1)}" ${currentPage === 1 ? "disabled" : ""}>← Previous</button>
    <div class="page-numbers">${pageButtons.join("")}</div>
    <div class="page-position">${currentPage} / ${totalPages}</div>
    <button class="page-nav" data-page="${Math.min(totalPages, currentPage + 1)}" ${currentPage === totalPages ? "disabled" : ""}>Next →</button>
  `;

}


function getArchiveDisplayOrder(items) {

  const grouped = new Map();

  items.forEach(item => {
    const isSpecial = itemType(item) === "special";
    const key = isSpecial
      ? `special:${specialGroupKey(item)}`
      : `season:${item.season}`;

    if (!grouped.has(key)) {
      grouped.set(key, {
        type: isSpecial ? "special" : "season",
        order: isSpecial ? itemOrder(item) : Number(item.season) * 100,
        items: []
      });
    }

    grouped.get(key).items.push(item);
  });

  return [...grouped.values()]
    .sort((a, b) => b.order - a.order)
    .flatMap(group =>
      group.items.sort((a, b) => {
        if (group.type === "special") {
          return (Number(a.special) || 0) - (Number(b.special) || 0);
        }

        return Number(a.episode) - Number(b.episode);
      })
    );
}


function getFullGroupCount(group) {

  if (group.type === "special") {
    return episodes.filter(item =>
      itemType(item) === "special"
      && specialGroupKey(item) === specialGroupKey(group.specialExample)
    ).length;
  }

  return episodes.filter(item =>
    itemType(item) === "episode"
    && Number(item.season) === Number(group.season)
  ).length;

}


function renderArchive() {

  const filtered = getArchiveDisplayOrder(
    getFilteredEpisodes().slice()
  );

  const totalPages = Math.max(1, Math.ceil(filtered.length / EPISODES_PER_PAGE));

  if (currentPage > totalPages) currentPage = totalPages;

  const pageStart = (currentPage - 1) * EPISODES_PER_PAGE;
  const pageEpisodes = filtered.slice(pageStart, pageStart + EPISODES_PER_PAGE);

  resultsCount.textContent = `${filtered.length} ${filtered.length === 1 ? "episode" : "episodes"}`;
  browseCount.innerHTML = `<strong>${filtered.length}</strong><span>EPISODES<br>FOUND</span>`;

  const activeFiltersList = [...selectedSeasons]
    .sort((a, b) => {
      if (a === "specials") return -1;
      if (b === "specials") return 1;
      return Number(b) - Number(a);
    })
    .map(value => value === "specials" ? "Specials" : `Season ${value}`);

  if (selectedSeasons.size === 0 && !searchQuery) {
    resultsStatus.textContent = "Showing all episodes";
  }
  else if (selectedSeasons.size > 0 && !searchQuery) {
    resultsStatus.textContent = activeFiltersList.join(" · ");
  }
  else if (selectedSeasons.size === 0 && searchQuery) {
    resultsStatus.textContent = `Search: “${searchInput.value.trim()}”`;
  }
  else {
    resultsStatus.textContent = `${activeFiltersList.join(" · ")} · “${searchInput.value.trim()}”`;
  }

  renderViewToggle();
  renderPagination(filtered.length);

  if (!filtered.length) {

    const hasSearch = Boolean(searchInput.value.trim());
    const hasFilters = selectedSeasons.size > 0;

    let recoveryText = "Nothing matches the current archive view.";

    if (hasSearch && hasFilters) {
      recoveryText =
        `Nothing matched “${escapeHTML(searchInput.value.trim())}” within the selected season filters.`;
    }
    else if (hasSearch) {
      recoveryText =
        `Nothing matched “${escapeHTML(searchInput.value.trim())}”.`;
    }
    else if (hasFilters) {
      recoveryText =
        "There are no archived episodes matching those season filters.";
    }

    archive.innerHTML = `
      <div class="empty-state">
        <strong>No episodes found</strong>
        <div class="empty-state-copy">${recoveryText}</div>

        <div class="empty-state-actions">
          ${hasSearch ? `
            <button
              type="button"
              class="empty-state-action"
              data-clear-search="true"
            >
              Clear search
            </button>
          ` : ""}

          ${hasFilters ? `
            <button
              type="button"
              class="empty-state-action"
              data-clear-season-filters="true"
            >
              Clear season filters
            </button>
          ` : ""}

          ${(hasSearch || hasFilters) ? `
            <button
              type="button"
              class="empty-state-action primary"
              data-clear-filters="true"
            >
              Reset all
            </button>
          ` : ""}
        </div>
      </div>
    `;
    return;
  }

  const grouped = new Map();

  pageEpisodes.forEach(item => {
    const isSpecial = itemType(item) === "special";
    const key = isSpecial
      ? `special:${specialGroupKey(item)}`
      : `season:${item.season}`;

    if (!grouped.has(key)) {
      grouped.set(key, {
        key,
        type: isSpecial ? "special" : "season",
        order: isSpecial ? itemOrder(item) : Number(item.season) * 100,
        season: isSpecial ? null : item.season,
        specialExample: isSpecial ? item : null,
        items: []
      });
    }

    grouped.get(key).items.push(item);
  });

  const groups = [...grouped.values()]
    .sort((a, b) => b.order - a.order);

  archive.innerHTML = groups.map(group => {

    const isSpecialGroup = group.type === "special";

    const groupItems = group.items.sort((a, b) => {
      if (isSpecialGroup) {
        return (Number(a.special) || 0) - (Number(b.special) || 0);
      }

      return Number(a.episode) - Number(b.episode);
    });

    const years = [...new Set(groupItems.map(item => item.year))]
      .filter(Boolean)
      .sort();

    let yearText = "";
    if (years.length === 1) yearText = String(years[0]);
    else if (years.length > 1) yearText = `${years[0]} — ${years[years.length - 1]}`;

    const heading = isSpecialGroup
      ? "Specials"
      : `Season ${group.season}`;

    const subheading = isSpecialGroup
      ? specialSectionLabel(group.specialExample)
      : yearText;

    const fullGroupItems = episodes
      .filter(item => {
        if (isSpecialGroup) {
          return itemType(item) === "special"
            && specialGroupKey(item) === specialGroupKey(group.specialExample);
        }

        return itemType(item) === "episode"
          && item.season === group.season;
      })
      .sort((a, b) => itemOrder(a) - itemOrder(b));

    const firstShownPosition =
      fullGroupItems.findIndex(item => item === groupItems[0]);

    const lastShownPosition =
      fullGroupItems.findIndex(item => item === groupItems[groupItems.length - 1]);

    const continuesFromPreviousPage =
      firstShownPosition > 0;

    const continuesToNextPage =
      lastShownPosition >= 0
      && lastShownPosition < fullGroupItems.length - 1;

    return `
      <section class="season-section ${isSpecialGroup ? "specials-section" : ""}">

        <header class="season-header">
          <div>
            <h2 class="season-name">
              ${heading}
              ${continuesFromPreviousPage ? `<span class="season-continuation">continued</span>` : ""}
            </h2>
            ${subheading ? `<div class="season-year">${escapeHTML(subheading)}</div>` : ""}
            ${isSpecialGroup && yearText ? `<div class="season-year">${escapeHTML(yearText)}</div>` : ""}
          </div>
          <div class="season-count">${getFullGroupCount(group)} ${getFullGroupCount(group) === 1 ? "episode" : "episodes"}</div>
        </header>

        <div class="episode-grid">
          ${groupItems.map(item => {
            const index = episodes.indexOf(item);
            return `
              <article
                class="episode-card ${itemType(item) === "special" ? "special-card" : ""}"
                data-index="${index}"
                tabindex="0"
                role="button"
                aria-label="Open ${escapeHTML(item.title)}"
              >
                <div class="grid-image">
                  <img
                    src="${escapeHTML(item.image)}"
                    alt="${escapeHTML(item.title)}"
                    loading="lazy"
                    decoding="async"
                  >
                  <span class="grid-number">${episodeCode(item)}</span>
                </div>
                <div class="grid-copy">
                  <h3 class="grid-title">${escapeHTML(item.title)}</h3>
                  <div class="list-description">${escapeHTML(item.description)}</div>
                  <span class="list-arrow" aria-hidden="true">→</span>
                </div>
              </article>
            `;
          }).join("")}
        </div>

        ${continuesToNextPage ? `
          <div class="season-boundary-note">
            <span>${escapeHTML(heading)} continues on the next page</span>
            <span class="boundary-arrow" aria-hidden="true">→</span>
          </div>
        ` : ""}

      </section>
    `;

  }).join("");

  initImageSkeletons();

}




function initImageSkeletons() {

  archive.querySelectorAll(".grid-image img").forEach(image => {

    const frame = image.closest(".grid-image");

    const markLoaded = () => {
      frame?.classList.add("loaded");
    };

    if (image.complete && image.naturalWidth > 0) {
      markLoaded();
      return;
    }

    image.addEventListener("load", markLoaded, { once: true });
    image.addEventListener("error", markLoaded, { once: true });

  });

}

/* =========================================================
   MODAL
========================================================= */

function updateModal(
  index
) {

  activeEpisodeIndex =
    (
      index
      +
      episodes.length
    )
    %
    episodes.length;

  const episode =
    episodes[
      activeEpisodeIndex
    ];

  const navigation =
    getSeasonNavigation(
      activeEpisodeIndex
    );

  const previousIndex =
    navigation.previousIndex;

  const nextIndex =
    navigation.nextIndex;

  modalImage.src =
    episode.image;

  modalImage.alt =
    episode.title;

  modalEpisode.textContent =
    episodeCode(
      episode
    );

  modalTitle.textContent =
    episode.title;

  modalDate.textContent =
    episode.date;

  modalSeason.textContent =
    itemType(episode) === "special"
      ? specialSectionLabel(episode)
      : `Season ${episode.season}`;

  modalDescription.textContent =
    episode.description;

  modalCounter.innerHTML =
    itemType(episode) === "special"
      ? `<span>Special</span> <strong>${navigation.localIndex + 1}</strong> of ${navigation.seasonIndexes.length}`
      : `<strong>${navigation.localIndex + 1}</strong> of ${navigation.seasonIndexes.length}`;

  const hasPrevious = previousIndex !== null;
  const hasNext = nextIndex !== null;

  previousTitle.textContent = hasPrevious
    ? episodes[previousIndex].title
    : "Start of season";

  nextTitle.textContent = hasNext
    ? episodes[nextIndex].title
    : "End of season";

  [modalPrevious, modalTopPrevious].forEach(button => {
    button.disabled = !hasPrevious;
    button.setAttribute("aria-disabled", String(!hasPrevious));

    if (hasPrevious) {
      button.dataset.targetIndex = previousIndex;
    }
    else {
      delete button.dataset.targetIndex;
    }
  });

  [modalNext, modalTopNext].forEach(button => {
    button.disabled = !hasNext;
    button.setAttribute("aria-disabled", String(!hasNext));

    if (hasNext) {
      button.dataset.targetIndex = nextIndex;
    }
    else {
      delete button.dataset.targetIndex;
    }
  });

  const crossGroup =
    getCrossGroupNavigation(activeEpisodeIndex);

  const crossLinks = [];

  if (!hasPrevious && crossGroup.previousIndex !== null) {
    const previousGroupEpisode =
      episodes[crossGroup.previousIndex];

    crossLinks.push(`
      <button
        type="button"
        class="modal-cross-link previous"
        data-cross-target-index="${crossGroup.previousIndex}"
        data-cross-direction="previous"
      >
        <span aria-hidden="true">←</span>
        <span>
          <span class="modal-cross-label">Previous section</span>
          <span class="modal-cross-title">
            Back to ${escapeHTML(groupDisplayName(previousGroupEpisode))}
          </span>
        </span>
      </button>
    `);
  }

  if (!hasNext && crossGroup.nextIndex !== null) {
    const nextGroupEpisode =
      episodes[crossGroup.nextIndex];

    crossLinks.push(`
      <button
        type="button"
        class="modal-cross-link next"
        data-cross-target-index="${crossGroup.nextIndex}"
        data-cross-direction="next"
      >
        <span>
          <span class="modal-cross-label">End of season</span>
          <span class="modal-cross-title">
            Continue to ${escapeHTML(groupDisplayName(nextGroupEpisode))}
          </span>
        </span>
        <span aria-hidden="true">→</span>
      </button>
    `);
  }

  modalCrossSeason.innerHTML =
    crossLinks.join("");

  modalCrossSeason.classList.toggle(
    "visible",
    crossLinks.length > 0
  );

  modalScroll.scrollTop = 0;

  syncURL();

}


function openModal(
  index
) {

  updateModal(
    index
  );

  modal.classList.add(
    "active"
  );

  syncURL();

  modal.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.classList.add(
    "modal-open"
  );


  setTimeout(
    () =>
      modalClose.focus(),
    120
  );

}


function closeModal() {

  modal.classList.remove(
    "active"
  );

  modal.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.classList.remove(
    "modal-open"
  );

  syncURL();

}


/* =========================================================
   EVENT DELEGATION
========================================================= */

document.addEventListener(
  "click",
  event => {

    const seasonButton =
      event.target.closest(
        ".season-button, .season-picker-card"
      );


    if (
      seasonButton
    ) {

      const value =
        seasonButton.dataset.season;


      if (
        value === "all"
      ) {

        selectedSeasons.clear();

      }

      else {

        const filterValue =
          value === "specials"
            ? "specials"
            : Number(value);

        if (
          selectedSeasons.has(filterValue)
        ) {

          selectedSeasons.delete(filterValue);

        }

        else {

          selectedSeasons.add(filterValue);

        }

      }


      currentPage = 1;

      renderSeasonRail();

      renderActiveFilters();

      renderArchive();

      syncURL();

      return;

    }


    const filterSeason =
      event.target.closest(
        "[data-filter-season]"
      );

    if (filterSeason) {
      const filterValue =
        filterSeason.dataset.filterSeason === "specials"
          ? "specials"
          : Number(filterSeason.dataset.filterSeason);

      selectedSeasons.delete(
        filterValue
      );

      currentPage = 1;
      renderSeasonRail();
      renderActiveFilters();
      renderArchive();
      syncURL();
      return;
    }


    const clearSearch =
      event.target.closest(
        "[data-clear-search]"
      );

    if (clearSearch) {
      searchInput.value = "";
      searchQuery = "";

      currentPage = 1;
      renderActiveFilters();
      renderArchive();
      syncURL();
      return;
    }


    const clearSeasonFilters =
      event.target.closest(
        "[data-clear-season-filters]"
      );

    if (clearSeasonFilters) {
      selectedSeasons.clear();

      currentPage = 1;
      renderSeasonRail();
      renderActiveFilters();
      renderArchive();
      syncURL();
      return;
    }


    const clearFilters =
      event.target.closest(
        "[data-clear-filters]"
      );

    if (clearFilters) {
      selectedSeasons.clear();
      searchInput.value = "";
      searchQuery = "";

      currentPage = 1;
      renderSeasonRail();
      renderActiveFilters();
      renderArchive();
      syncURL();
      return;
    }


    const viewButton = event.target.closest("[data-view]");

    if (viewButton) {
      viewMode = viewButton.dataset.view === "list" ? "list" : "grid";
      renderViewToggle();
      syncURL();
      return;
    }

    const pageButton = event.target.closest("[data-page]");

    if (pageButton && !pageButton.disabled) {
      const requestedPage = Number(pageButton.dataset.page);
      if (Number.isFinite(requestedPage) && requestedPage > 0) {
        currentPage = Math.floor(requestedPage);
        renderArchive();
        syncURL();
        document.querySelector(".results-line")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      return;
    }

    const crossLink =
      event.target.closest(
        "[data-cross-target-index]"
      );

    if (crossLink) {
      const targetIndex =
        Number(crossLink.dataset.crossTargetIndex);

      if (!Number.isNaN(targetIndex)) {
        animateModalChange(
          targetIndex,
          crossLink.dataset.crossDirection === "previous"
            ? "previous"
            : "next"
        );
      }

      return;
    }


    const card =
      event.target.closest(
        "[data-index]"
      );


    if (
      card
    ) {

      const index =
        Number(
          card.dataset.index
        );


      if (
        !Number.isNaN(
          index
        )
      ) {

        openModal(
          index
        );

      }

    }

  }
);


/* =========================================================
   CARD KEYBOARD OPEN
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    const card =
      event.target.closest(
        ".episode-card"
      );


    if (
      card
      &&
      (
        event.key === "Enter"
        ||
        event.key === " "
      )
    ) {

      event.preventDefault();

      openModal(
        Number(
          card.dataset.index
        )
      );

      return;

    }


    if (
      !modal.classList.contains(
        "active"
      )
    ) {

      return;

    }


    if (
      event.key === "Escape"
    ) {

      closeModal();

    }


    if (
      event.key === "ArrowLeft"
    ) {

      goToModalTarget(
        modalTopPrevious
      );

    }


    if (
      event.key === "ArrowRight"
    ) {

      goToModalTarget(
        modalTopNext
      );

    }

  }
);

/* =========================================================
   RANDOM EPISODE
========================================================= */

randomEpisodeButton
  .addEventListener(
    "click",
    () => {

      const candidates =
        getFilteredEpisodes();

      const pool =
        candidates.length
          ?
          candidates
          :
          episodes;

      const selected =
        pool[
          Math.floor(
            Math.random()
            *
            pool.length
          )
        ];

      const index =
        episodes.indexOf(
          selected
        );

      randomEpisodeButton.classList.remove(
        "is-shuffling"
      );

      void randomEpisodeButton.offsetWidth;

      randomEpisodeButton.classList.add(
        "is-shuffling"
      );

      window.setTimeout(
        () => {
          randomEpisodeButton.classList.remove(
            "is-shuffling"
          );

          openModal(
            index
          );
        },
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
          ?
          0
          :
          230
      );

    }
  );

function goToModalTarget(button) {

  if (button.disabled || !button.dataset.targetIndex) return;

  const index =
    Number(
      button.dataset.targetIndex
    );

  if (Number.isNaN(index)) return;

  const isPrevious =
    button === modalPrevious
    ||
    button === modalTopPrevious;

  const direction =
    isPrevious ? "previous" : "next";

  animateModalChange(index, direction);

}


function animateModalChange(index, direction) {

  const reducedMotion =
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

  if (reducedMotion) {
    updateModal(index);
    return;
  }

  const outgoingX =
    direction === "next" ? -22 : 22;

  const incomingX =
    direction === "next" ? 22 : -22;

  const outgoing =
    modalScroll.animate(
      [
        { transform: "translateX(0)", opacity: 1 },
        { transform: `translateX(${outgoingX}px)`, opacity: 0 }
      ],
      {
        duration: 135,
        easing: "cubic-bezier(.4,0,1,1)",
        fill: "forwards"
      }
    );

  outgoing.finished
    .catch(() => {})
    .then(() => {
      updateModal(index);

      modalScroll.animate(
        [
          { transform: `translateX(${incomingX}px)`, opacity: 0 },
          { transform: "translateX(0)", opacity: 1 }
        ],
        {
          duration: 220,
          easing: "cubic-bezier(.2,.8,.2,1)",
          fill: "both"
        }
      );
    });

}


modalPrevious
  .addEventListener(
    "click",
    () => goToModalTarget(modalPrevious)
  );


modalNext
  .addEventListener(
    "click",
    () => goToModalTarget(modalNext)
  );


modalTopPrevious
  .addEventListener(
    "click",
    () => goToModalTarget(modalTopPrevious)
  );


modalTopNext
  .addEventListener(
    "click",
    () => goToModalTarget(modalTopNext)
  );


/* =========================================================
   MOBILE MODAL SWIPE
========================================================= */

modalScroll.addEventListener(
  "touchstart",
  event => {

    if (event.touches.length !== 1) return;

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;
    touchTracking = true;

  },
  { passive: true }
);


modalScroll.addEventListener(
  "touchend",
  event => {

    if (!touchTracking || !modal.classList.contains("active")) return;

    touchTracking = false;

    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;

    if (
      Math.abs(deltaX) < 55
      ||
      Math.abs(deltaX) <= Math.abs(deltaY) * 1.15
    ) {
      return;
    }

    if (deltaX > 0) {
      goToModalTarget(modalTopPrevious);
    }
    else {
      goToModalTarget(modalTopNext);
    }

  },
  { passive: true }
);



/* =========================================================
   SEASON TOOLTIP + MOBILE FILTER DRAWER
========================================================= */

function showSeasonTooltip(button) {

  if (!seasonTooltip || !button?.dataset.tooltip) return;

  const rect = button.getBoundingClientRect();

  seasonTooltip.textContent =
    button.dataset.tooltip;

  seasonTooltip.style.left =
    `${rect.left + rect.width / 2}px`;

  seasonTooltip.style.top =
    `${rect.top}px`;

  seasonTooltip.classList.add("visible");
  seasonTooltip.setAttribute("aria-hidden", "false");

}


function hideSeasonTooltip() {

  if (!seasonTooltip) return;

  seasonTooltip.classList.remove("visible");
  seasonTooltip.setAttribute("aria-hidden", "true");

}


seasonRail.addEventListener("pointerover", event => {

  const button =
    event.target.closest(".season-button[data-tooltip]");

  if (button) showSeasonTooltip(button);

});


seasonRail.addEventListener("pointerout", event => {

  const button =
    event.target.closest(".season-button[data-tooltip]");

  if (button) hideSeasonTooltip();

});


seasonRail.addEventListener("focusin", event => {

  const button =
    event.target.closest(".season-button[data-tooltip]");

  if (button) showSeasonTooltip(button);

});


seasonRail.addEventListener("focusout", hideSeasonTooltip);


window.addEventListener("scroll", hideSeasonTooltip, { passive: true });
window.addEventListener("resize", hideSeasonTooltip);


mobileFilterButton?.addEventListener("click", () => {

  const strip =
    mobileFilterButton.closest(".season-strip");

  const open =
    !strip.classList.contains("mobile-open");

  strip.classList.toggle("mobile-open", open);

  mobileFilterButton.setAttribute(
    "aria-expanded",
    String(open)
  );

  if (open) {
    requestAnimationFrame(() => {
      const activeButton =
        seasonRail.querySelector(".season-button.active")
        || seasonRail.querySelector(".season-button");

      activeButton?.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "center"
      });
    });
  }

});


/* =========================================================
   URL STATE / BACK-FORWARD
========================================================= */

function applyURLState() {

  suppressURLSync = true;

  const episodeIndex =
    readURLState();

  renderSeasonRail();
  renderActiveFilters();
  renderArchive();

  if (episodeIndex >= 0) {
    openModal(episodeIndex);
  }
  else if (modal.classList.contains("active")) {
    closeModal();
  }

  suppressURLSync = false;

}


window.addEventListener(
  "popstate",
  applyURLState
);


/* =========================================================
   TOP SEASON BROWSER CONTROLS
========================================================= */

if (seasonRailPrevious) {
  seasonRailPrevious.addEventListener("click", () => {
    seasonRail.scrollBy({ left: -360, behavior: "smooth" });
  });
}

if (seasonRailNext) {
  seasonRailNext.addEventListener("click", () => {
    seasonRail.scrollBy({ left: 360, behavior: "smooth" });
  });
}


/* =========================================================
   INITIALISE
========================================================= */

const initialEpisodeIndex =
  readURLState();

renderPage();


if (initialEpisodeIndex >= 0) {
  openModal(initialEpisodeIndex);
}
else {
  syncURL();
}

</script>
